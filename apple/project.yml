# XcodeGen spec: `brew install xcodegen && xcodegen` in this folder makes NuniFlix.xcodeproj.
# One codebase, two apps: Apple TV and iPhone/iPad.
name: NuniFlix
options:
  bundleIdPrefix: com.nuniflix
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # pick your team in Xcode → Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
targets:
  NuniFlix-TV:
    type: application
    platform: tvOS
    sources: [Sources]
    info:
      path: Info-TV.plist
      properties:
        CFBundleDisplayName: NuniFlix
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true   # home servers are often plain http://192.168.x.x
        LSApplicationQueriesSchemes: [plex]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nuniflix.tv
  NuniFlix-iOS:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info-iOS.plist
      properties:
        CFBundleDisplayName: NuniFlix
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSApplicationQueriesSchemes: [plex]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nuniflix.app
        TARGETED_DEVICE_FAMILY: "1,2"
