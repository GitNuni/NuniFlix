/* search just this service */
let provQTimer, provQSeq = 0;
$("#provQ").addEventListener("input", () => { clearTimeout(provQTimer); provQTimer = setTimeout(provSearch, 450); });
$("#provQ").addEventListener("keydown", e => { if (e.key === "Enter") { clearTimeout(provQTimer); provSearch(); e.target.blur(); } });
async function provSearch() {
  const q = $("#provQ").value.trim(), seq = ++provQSeq, searching = q.length >= 2;
  $("#provFound").hidden = !searching;
  $("#provView").classList.toggle("searching", searching);
  if (!searching) return;
  $("#provFound").innerHTML = `<div class="spin"></div>`;
  try {
    const d = await api(`/browse/provider/${encodeURIComponent(PROV.id)}/search?q=${encodeURIComponent(q)}`);
    if (seq !== provQSeq) return;
    $("#provFound").innerHTML = d.results.length ? `<div class="grid">${d.results.map(tile).join("")}</div>`
      : `<p class="empty">Nothing matching “${esc(q)}” is on ${esc(PROV.name)}.</p>`;
  } catch (e) { if (seq === provQSeq) $("#provFound").innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
}

/* service home: featured title + category rows */
async function showRows() {
  PROV.view = "rows"; PROV.seq++;
  $("#provAll").hidden = true; $("#provRows").hidden = false; $("#provKind").hidden = false;
  const key = PROV.id + ":" + PROV.kind, seq = PROV.seq;
  if (!ROWS[key]) {
    $("#provRows").innerHTML = `<div class="spin"></div>`;
    try { ROWS[key] = await api(`/browse/provider/${encodeURIComponent(PROV.id)}/rows?type=${PROV.kind}`); }
    catch (e) { if (seq === PROV.seq) $("#provRows").innerHTML = `<p class="empty">${esc(e.message)}</p>`; return; }
    if (seq !== PROV.seq) return;
  }
  if ($("#provRows").dataset.key === key) return;  // already showing these rows
  const d = ROWS[key], h = d.hero;
  $("#provRows").dataset.key = key;
  if (!d.rows.length) { $("#provRows").innerHTML = `<p class="empty">Nothing here.</p>`; return; }
  const lab = h && statusLabel(h);
  $("#provRows").innerHTML =
    (h ? `<button class="feature" data-type="${h.type === "tv" && !h.id ? "tvtmdb" : h.type}" data-id="${h.type === "tv" && !h.id ? h.tmdb : h.id}"
        style="background-image:url('${bg(h.backdrop)}')">${lab ? `<span class="pill ${lab[1]}">${lab[0]}</span>` : ""}
        <div class="info"><div class="eyebrow">Popular on ${esc(PROV.name)}</div><div class="ft">${esc(h.title)}</div>
        <div class="fo">${esc(h.overview)}</div></div></button>` : "") +
    d.rows.map((r, i) => `<h2>${esc(r.title)} <small><button class="see" data-row="${i}">See all</button></small></h2>
      <div class="row" data-ri="${i}">${r.items.map(tile).join("")}</div>`).join("");
}
$("#provRows").addEventListener("scroll", e => {  // scroll doesn't bubble, so listen in the capture phase
  const row = e.target.closest?.(".row[data-ri]");
  if (row && row.scrollLeft + row.clientWidth > row.scrollWidth - 500) rowMore(row);
}, true);
async function rowMore(el) {
  const key = PROV.id + ":" + PROV.kind, r = ROWS[key]?.rows[+el.dataset.ri];
  if (!r || r.loading || (r.page || 1) >= (r.total || 99)) return;
  r.loading = true;
  try {
    const d = await api(`/browse/provider/${encodeURIComponent(PROV.id)}?type=${PROV.kind}&sort=${r.sort}&page=${(r.page || 1) + 1}${r.cat ? "&cat=" + r.cat : ""}&quick=1`);
    r.page = d.page; r.total = d.total_pages;
    const seen = new Set(r.items.map(x => x.type + (x.id || "t" + x.tmdb)));
    const fresh = d.results.filter(x => !seen.has(x.type + (x.id || "t" + x.tmdb)));
    r.items.push(...fresh);
    if ($("#provRows").dataset.key === key) el.insertAdjacentHTML("beforeend", fresh.map(tile).join(""));
  } catch {}
  r.loading = false;
}
$("#provRows").addEventListener("click", e => {
  const b = e.target.closest("[data-row]"); if (!b) return;
  const r = ROWS[PROV.id + ":" + PROV.kind].rows[+b.dataset.row];
  nav({...CUR, item: null, view: "all", title: r.title, cat: r.cat, sort: r.sort});
});

/* "see all": one category as an endless grid */
function showAll(title, cat, sort) {
  Object.assign(PROV, {view: "all", cat, sort});
  $("#allTitle").textContent = title || "";
  $$("#provSort button").forEach(x => x.classList.toggle("on", x.dataset.s === sort));
  $("#provRows").hidden = true; $("#provKind").hidden = true; $("#provAll").hidden = false;
  const grid = [PROV.id, PROV.kind, cat, sort].join("|");
  if (PROV.grid !== grid || !$("#provGrid").children.length) { PROV.grid = grid; provReset(); }  // else keep what's loaded
}
function provReset() { PROV.page = 0; PROV.total = 1; PROV.seq++; $("#provGrid").innerHTML = ""; provMore(); }
async function provMore() {
  if (PROV.view !== "all" || PROV.loading === PROV.seq || PROV.page >= PROV.total) return;
  const seq = PROV.seq; PROV.loading = seq;  // a reset bumps seq, so a stale load never blocks the new one
  $("#provMore").innerHTML = `<div class="spin"></div>`;
  try {
    const d = await api(`/browse/provider/${encodeURIComponent(PROV.id)}?type=${PROV.kind}&sort=${PROV.sort}&page=${PROV.page + 1}${PROV.cat ? "&cat=" + PROV.cat : ""}&quick=1`);
    if (seq !== PROV.seq) return;
    PROV.page = d.page; PROV.total = d.total_pages;
    $("#provGrid").insertAdjacentHTML("beforeend", d.results.map(tile).join(""));
    $("#provMore").innerHTML = PROV.page < PROV.total ? `<button class="btn wide gray" data-more style="margin-top:18px">Load more</button>`
      : (!$("#provGrid").children.length ? `<p class="empty">Nothing here.</p>` : `<p class="empty">That's everything.</p>`);
  } catch (e) { if (seq === PROV.seq) $("#provMore").innerHTML = `<p class="empty">${esc(e.message)}</p><button class="btn gray" data-more>Try again</button>`; return; }
  finally { if (PROV.loading === seq) PROV.loading = false; }
  // still near the bottom (short page or fast scrolling)? keep going
  if (seq === PROV.seq && $("#provMore").getBoundingClientRect().top < innerHeight + 600) provMore();
}
$("#provMore").addEventListener("click", e => { if (e.target.closest("[data-more]")) provMore(); });
window.addEventListener("scroll", () => {
  if (CUR.prov && PROV.view === "all" && $("#provMore").getBoundingClientRect().top < innerHeight + 600) provMore();
}, {passive: true});
new IntersectionObserver(es => { if (es[0].isIntersecting && CUR.prov && PROV.view === "all") provMore(); }, {rootMargin: "600px"}).observe($("#provMore"));
$("#provBack").onclick = back;
$("#provKind").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  nav({...CUR, kind: b.dataset.k, view: "rows"}, true); });
$("#provSort").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  nav({...CUR, sort: b.dataset.s}, true); });

  if (CUR.view === "movie" || CUR.view === "tv") {  // "See all" on a home row
    const k = CUR.view;

      $("#homeBody .spin").outerHTML = results.length ? `<div class="grid">${results.map(tile).join("")}</div>` : `<p class="empty">Nothing yet.</p>`;
    } catch (e) { $("#homeBody .spin").outerHTML = `<p class="empty">${esc(e.message)}</p>`; }

  try {

/* The big banner at the top of Home: swipe through a few trending titles that aren't on the server yet (or something new in the
   library when there's nothing), the one showing plays its trailer by itself, Request (or Play) and More info. */
async function fillFeatured(heroes, list) {
  const el = $("#bb");
  if (!el) return;
  let items = heroes;
  if (!items.length) {
    const pool = list.filter(m => m.backdrop && m.status === "available").slice(0, 12);
    if (!pool.length) return el.remove();
    items = [pool[Math.floor(Math.random() * pool.length)]];
  }
  const ref = x => x.type === "tv" && !x.id ? {type: "tvtmdb", id: x.tmdb} : {type: x.type, id: x.id};
  const slide = (x, i, clone = false) => {
    const it = ref(x), have = x.status === "available", lab = ["pending", "processing"].includes(x.status) && statusLabel(x);
    return `<div class="bb${clone ? " clone" : ""}" data-i="${i}"${clone ? ' aria-hidden="true"' : ""}><div class="bb-media" style="background-image:url('${bg(x.backdrop)}')"></div><div class="bb-tr"></div>
      <button class="vmute" hidden aria-label="Sound on">${SPEAKER(false)}</button>
      <div class="bb-body"><p class="bb-kick">${heroes.length ? `Trending this week${x.type === "tv" ? " · Series" : ""}` : `New on ${esc(APP())}`}</p>
        <div class="bb-title">${esc(x.title)}</div>
        ${x.genres?.length ? `<div class="bb-genres">${x.genres.map(esc).join(" · ")}</div>` : ""}
        ${x.requested_by ? `<div class="bb-who">${WHO}Requested by ${esc(x.requested_by)}</div>` : ""}
        <div class="bb-acts">${have ? `<a class="btn bb-play" hidden target="_blank" rel="noopener">▶ Play</a>`
          : `<button class="btn bb-play bb-req">${lab ? esc(lab[0]) : "＋ " + esc(W("request"))}</button>`}
          <button class="btn gray bb-info" data-type="${it.type}" data-id="${it.id}">ⓘ More info</button></div></div></div>`;
  };
  const n = items.length, loop = n > 1;
  // it loops: a copy of the last slide sits before the first and a copy of the first after the last; landing on a copy jumps to the real one
  el.innerHTML = `<div class="bbtrack">${loop ? slide(items[n - 1], n - 1, true) : ""}${items.map((x, i) => slide(x, i)).join("")}${loop ? slide(items[0], 0, true) : ""}</div>${items.length > 1 ? `<div class="bbdots" aria-hidden="true">${items.map((_, i) => `<i data-i="${i}"></i>`).join("")}</div>` : ""}`;
  el.hidden = false;
  const track = $(".bbtrack", el), slides = $$(".bb:not(.clone)", el), done = new Set();
  let cur = -1, timer;
  track.onclick = e => {
    const sl = e.target.closest(".bb");
    if (sl && (e.target.closest(".bb-req") || !e.target.closest("a,button"))) nav({...CUR, item: ref(items[+sl.dataset.i])});
  };
  const home = () => CUR.tab === "home" && !CUR.view && !CUR.item && !CUR.person && !CUR.swipe && !CUR.match && !CUR.wrapped && !CUR.office && !CUR.live
    && !document.hidden && el.isConnected && el.getBoundingClientRect().bottom > 80;
  async function show(i) {
    if (i === cur || !slides[i]) return;
    cur = i;
    $$(".bbdots i", el).forEach((d, j) => d.classList.toggle("on", j === i));
    slides.forEach((sl, j) => {  // only the one showing keeps a trailer (a fresh box makes the old player clean itself up)
      if (j === i) return;
      const old = $(".bb-tr", sl);
      if (old.firstChild) { const box = document.createElement("div"); box.className = "bb-tr"; old.replaceWith(box); }
      const m = $(".vmute", sl); m.hidden = true; m.innerHTML = SPEAKER(false);
    });
    const x = items[i], sl = slides[i];
    if (x.poster) posterHue(x.poster).then(hue => { if (cur === i && typeof hue === "number") document.documentElement.style.setProperty("--bb-h", hue); });
    if (!x._xt) {
      const have = x.status === "available";
      const [w, xt] = await Promise.all([have && x.type === "movie" ? api(`/watch/movie/${x.id}`, {quiet: true}).catch(() => ({})) : {},
        x.tmdb ? api(`/extra/${x.type}/${x.tmdb}`, {quiet: true}).catch(() => ({})) : {}]);
      x._xt = xt;
      const play = ME.accounts.some(a => a.source === "plex") && w.plex ? w.plex : w.jellyfin || w.plex;
      if (play && have) { const a = $(".bb-play", sl); a.href = play; a.hidden = false; }
    }
    if (!done.has(i) && x._xt.logo) {  // the film's own title art, like the poster
      done.add(i);
      const img = new Image(); img.alt = x.title;
      img.onload = () => $$(`.bb[data-i="${i}"] .bb-title`, el).forEach((t, k) => t.replaceChildren(k ? img.cloneNode() : img));
      img.src = x._xt.logo;
    }
    if (x._xt.trailer) setTimeout(() => { if (cur === i) ytInto($(".bb-tr", sl), x._xt.trailer, () => cur === i && home(), $(".vmute", sl)); }, 1200);
    const nx = items[(i + 1) % n];  // get the next one's title art ready
    if (nx && !nx._xt && nx.tmdb) api(`/extra/${nx.type}/${nx.tmdb}`, {quiet: true}).then(xt => { nx._xt = nx._xt || xt; }).catch(() => {});
  }
  track.addEventListener("scroll", () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      let at = Math.round(track.scrollLeft / track.clientWidth);
      if (loop && (at === 0 || at === n + 1)) {  // on a copy: jump to the real slide without animating
        at = at === 0 ? n : 1;
        track.style.scrollSnapType = "none"; track.scrollLeft = at * track.clientWidth; track.style.scrollSnapType = "";
      }
      show(loop ? at - 1 : at);
    }, 120);
  }, {passive: true});
  if (loop) track.scrollLeft = track.clientWidth;  // start on the real first slide
  show(0);
}

/* Swipe a sheet down to close it, like an iPhone sheet (only from the top of its content, and only a mostly
   vertical drag, so sideways rows like the cast still scroll). */
(() => {
  const sh = $("#sheet"), scrim = $("#scrim");
  let x0 = null, y0 = null, dy = 0, t0 = 0, dragging = false;
  sh.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dy = 0; t0 = Date.now(); dragging = false;
  }, {passive: true});
  sh.addEventListener("touchmove", e => {
    if (y0 == null) return;
    const d = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
    if (!dragging) {
      if (sh.scrollTop > 0 || d < 0 || Math.abs(dx) > Math.abs(d)) { if (Math.abs(d) > 6 || Math.abs(dx) > 6) y0 = null; return; }
      if (d < 8) return;
      dragging = true; sh.style.transition = "none"; scrim.style.transition = "none";
    }
    dy = Math.max(0, d);
    sh.style.transform = `translateY(${dy}px)`;
    scrim.style.opacity = String(Math.max(0, 1 - dy / 600));
    e.preventDefault();
  }, {passive: false});
  const end = () => {
    if (!dragging) { y0 = null; return; }
    const fast = dy / Math.max(1, Date.now() - t0) > 0.5;
    sh.style.transition = ""; scrim.style.transition = ""; scrim.style.opacity = "";
    if (dy > 110 || (fast && dy > 30)) {
      sh.style.transform = "translateY(100%)";
      setTimeout(() => { closeSheet(); sh.style.transform = ""; }, 260);
    } else sh.style.transform = "";
    y0 = null; dragging = false; dy = 0;
  };
  sh.addEventListener("touchend", end);
  sh.addEventListener("touchcancel", end);
})();

/* ---------- Play here: the person's own Plex/Jellyfin, streamed through NuniFlix (server: player.py) ----------
   Safari and the iPhone/iPad play the stream themselves; other browsers use hls.js (web/vendor, loaded on first use)
   and get a version every browser can play (H.264 + stereo AAC). Progress goes back every 10 s so Plex/Jellyfin keep
   the resume point; "stopped" when the player closes. */
const PL = {native: !!document.createElement("video").canPlayType("application/vnd.apple.mpegurl")};
const plClock = s => { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
const plCanResume = e => e.resume > 15 && (!e.duration || e.resume < e.duration * .95);

async function playHere(it) {
  let o;
  try { o = await api(`/play/${it.type}/${it.id}`); } catch (e) { toast(e.message); return; }
  plOpen(it.title);
  PL.title = it;
  if (it.type === "movie") plAsk(o.items[0], []);
  else plEpisodes(o.items);
}

function plOpen(title) {
  plClose();
  const el = document.createElement("div");
  el.className = "player"; el.id = "player";
  el.innerHTML = `<div class="pl-top"><b>${esc(title)}</b><span class="pl-exp">super experimental</span>
    <button class="pl-cc" hidden aria-label="Subtitles">CC</button><button class="close" aria-label="Close">✕</button></div><div class="pl-body"></div><div class="pl-panel" hidden></div>`;
  document.body.appendChild(el);
  el.querySelector(".close").onclick = plClose;
  el.querySelector(".pl-cc").onclick = plSubs;
  document.addEventListener("keydown", plKey);
}
const plKey = e => { if (e.key === "Escape" && !document.fullscreenElement) plClose(); };
const plBody = () => $("#player .pl-body");

function plEpisodes(eps) {
  const next = eps.find(plCanResume) || eps.find(e => !e.watched) || eps[0];
  const row = e => `<button class="li pl-ep${e.watched ? " seen" : ""}" data-id="${esc(e.id)}"><span class="pl-mark">${e.watched ? "✓" : plCanResume(e) ? "◐" : ""}</span>
    <div class="body"><div class="t">${esc(e.title || "Episode " + (e.episode ?? ""))}</div>
    <div class="s">${[e.season != null && `S${e.season} · E${e.episode}`, e.duration && Math.round(e.duration / 60) + "m", plCanResume(e) && Math.round((e.duration - e.resume) / 60) + "m left"].filter(Boolean).join(" · ")}</div></div></button>`;
  const seasons = [...new Set(eps.map(e => e.season ?? 0))].sort((a, b) => a - b);
  plBody().innerHTML = `<div class="pl-list">${next ? `<h2>Next up</h2><div class="list">${row(next)}</div>` : ""}
    ${seasons.map(n => `<h2>${n ? "Season " + n : "Specials"}</h2><div class="list">${eps.filter(e => (e.season ?? 0) === n).map(row).join("")}</div>`).join("")}</div>`;
  plBody().querySelectorAll(".pl-ep").forEach(b => b.onclick = () => {
    const i = eps.findIndex(e => e.id === b.dataset.id);
    plAsk(eps[i], eps.slice(i + 1));
  });
}

function plAsk(e, upNext) {
  if (!plCanResume(e)) return plStart(e, 0, upNext);
  plBody().innerHTML = `<div class="pl-ask"><h2>${esc(e.title)}</h2>
    <button class="btn" id="plResume">Resume from ${plClock(e.resume)}</button><button class="btn gray" id="plFresh">Start from the beginning</button></div>`;
  $("#plResume").onclick = () => plStart(e, e.resume, upNext);
  $("#plFresh").onclick = () => plStart(e, 0, upNext);
}

let plHls = null;
function loadHls() {
  if (window.Hls) return Promise.resolve();
  return new Promise((ok, bad) => { const sc = document.createElement("script"); sc.src = "/vendor/hls.min.js"; sc.onload = ok; sc.onerror = bad; document.head.appendChild(sc); });
}

async function plStart(e, at, upNext, subtitle, pre) {
  plStopStream();  // no need to wait for the old one to be told it stopped
  PL.ep = e; PL.upNext = upNext; PL.sub = subtitle ?? null;
  if (subtitle != null || PL.vttFor !== e.id) PL.vtt = null;  // a burned-in track replaces drawn subtitles; a new episode drops them
  $("#player .pl-panel")?.setAttribute("hidden", "");
  plBody().innerHTML = `<div class="pl-stage"><video controls autoplay playsinline></video><p class="pl-msg">Starting…</p></div>`;
  const v = plBody().querySelector("video"), msg = plBody().querySelector(".pl-msg");
  const fail = text => { if (msg) { msg.textContent = text; msg.hidden = false; } };
  let st;
  if (!PL.native) loadHls().catch(() => {});  // fetch the player script while the stream starts
  try { st = pre || await api("/play/start", {body: {id: e.id, offset: 0, at: at > 0 ? at : 0, platform: PL.native ? "ios" : "web", ...(subtitle != null ? {subtitle} : {}), ...(PL.live ? {live: true} : {})}}); }
  catch (err) { return fail(err.message); }
  if (!$("#player")) { api("/play/progress", {body: {session: st.session, position: 0, state: "stopped"}}).catch(() => {}); return; }
  // No progress until the jump to the resume point has happened: a 0:00 report would wipe the resume point.
  PL.cur = {session: st.session, video: v, last: 0, hold: at > 0 ? at : 0};
  $("#player .pl-cc").hidden = false;
  if (PL.vtt) plAddVtt(PL.vtt);
  // Safari (and the iPhone app) can drop a seek made before it's ready, so try again until it sticks.
  const jump = () => { if (at > 0 && v.currentTime < at - 5) v.currentTime = at; };
  if (at > 0) {
    ["loadedmetadata", "canplay", "playing"].forEach(ev => v.addEventListener(ev, jump, {once: true}));
    const landed = () => { if (PL.cur?.video === v && v.currentTime >= at - 5) PL.cur.hold = 0; };
    v.addEventListener("seeked", landed); v.addEventListener("playing", landed);
  }
  v.addEventListener("loadedmetadata", () => { msg.hidden = true; }, {once: true});
  v.addEventListener("playing", () => { msg.hidden = true; });
  v.addEventListener("ended", async () => {
    await plStopStream();
    if (PL.live) lvTune(PL.live); else if (upNext.length) plStart(upNext[0], 0, upNext.slice(1)); else plClose();
  });
  v.addEventListener("error", () => fail("The video wouldn't play here. Try Play in Plex or Play in Jellyfin."));
  v.addEventListener("timeupdate", () => { if (Date.now() - PL.cur?.last > 10000) plReport("auto"); });
  v.addEventListener("pause", () => plReport("paused"));
  if (PL.native) { v.src = st.url; return; }
  try { await loadHls(); } catch { return fail("Couldn't load the player. Check your connection and try again."); }
  if (!window.Hls?.isSupported()) return fail("This browser can't play it. Try Play in Plex or Play in Jellyfin.");
  plHls = new Hls({startPosition: at > 0 ? at : -1});
  plHls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) fail("The video stopped: " + (d.details || "playback error") + ". Try again, or use Play in Plex."); });
  plHls.loadSource(st.url);
  plHls.attachMedia(v);
}

/* Subtitles (server: subtitles.py). Tracks on the title are burned in by Plex/Jellyfin (the stream restarts where you
   were); OpenSubtitles files (when that's the source in Settings) are added to the video as a subtitle track. */
async function plSubs() {
  const panel = $("#player .pl-panel"), e = PL.ep;
  if (!panel || !e) return;
  if (!panel.hidden) { panel.hidden = true; return; }
  panel.hidden = false;
  panel.innerHTML = `<p class="pl-note">Loading subtitles…</p>`;
  let t;
  try { t = await api(`/subs/${encodeURIComponent(e.id)}`); } catch (err) { panel.innerHTML = `<p class="pl-note">${esc(err.message)}</p>`; return; }
  const on = id => PL.sub === id && !PL.vtt ? " on" : "";
  panel.innerHTML = `<h3>Subtitles</h3>
    <button class="pl-opt${PL.sub == null && !PL.vtt || PL.sub === 0 ? " on" : ""}" data-t="0">Off</button>
    ${t.tracks.map(x => `<button class="pl-opt${on(x.id)}" data-t="${x.id}">${esc(x.title)}</button>`).join("")}
    ${PL.vtt ? `<button class="pl-opt on" disabled>From OpenSubtitles</button>` : ""}
    <button class="pl-opt find" id="plFind">Find subtitles…</button>`;
  panel.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    const id = Number(b.dataset.t), v = PL.cur?.video;
    if (id === 0 && PL.vtt) { PL.vtt = null; v?.querySelectorAll("track").forEach(x => x.remove()); panel.hidden = true; if (!PL.sub) return; }
    plStart(e, v?.currentTime || 0, PL.upNext, id);
  });
  $("#plFind").onclick = () => plFind(e);
}

async function plFind(e) {
  const panel = $("#player .pl-panel"), it = PL.title;
  panel.innerHTML = `<p class="pl-note">Searching…</p>`;
  let r;
  try {

/* Repertory and Premiere give each title its own color: the strongest one in its poster (black when the poster has none). */
const INK_THEMES = ["repertory", "premiere"];
const INKS = new Map();

      : s.have ? `${s.have} of ${s.episodes} episodes` : s.episodes ? `${s.episodes} episodes` : it.status === "none" ? "" : "Not aired yet";
    return {...s, full, waiting, locked: full || waiting, note};
  });
  const pickable = seasons.filter(s => !s.locked);
  const brandNew = isTV && it.status === "none" && !pending.length;  // nothing of it here yet: picking every season = the whole show

  let action;
  if (it.status === "available" && !isTV) action = `<button class="btn wide gray" disabled>${W("inLibrary")}</button>`;
  else if (!isTV && it.status === "pending") action = `<button class="btn wide gray" disabled>Requested${open?.requested_by.name ? " by " + esc(open.requested_by.name) : ""} · waiting for approval</button>`;
  else if (!isTV && it.status === "processing") action = `<button class="btn wide gray" disabled>${it.progress != null ? `Downloading · ${it.progress}%` : "Requested · on its way"}</button>`;
  else if (isTV && !pickable.length) action = `<button class="btn wide gray" disabled>${seasons.every(s => s.full) ? "✓ Every season is in your library" : "Everything is requested"}</button>`;
  else action = `<button class="btn wide" id="reqBtn">${W("request")}</button>`;
  if (ME.admin && pending.length) action += `<div style="height:8px"></div><button class="btn wide green" data-approve="${pending[0].id}">Approve ${esc(pending[0].requested_by.name)}'s request</button>`;
  // 4K copy (own server, own status)
  if (ME.has4k?.[it.type] && ME.perms?.request_4k) {
    const p4 = (it.requests || []).find(r => r.is4k && r.status === "pending");
    action += `<div style="height:8px"></div>` + (!isTV && it.status4k === "available" ? `<button class="btn wide gray" disabled>✓ In your library in 4K</button>`
      : !isTV && it.status4k === "processing" ? `<button class="btn wide gray" disabled>4K copy on its way</button>`
      : !isTV && p4 ? `<button class="btn wide gray" disabled>4K requested · waiting for approval</button>`
      : `<button class="btn wide gray" id="req4k">${W("request")} in 4K</button>` + (isTV ? `<p class="quota">Nothing picked = the whole show in 4K</p>` : ""));
  }
  const q = ME.quota?.[it.type];
  if (ME.admin) action += `<details class="adm" id="adv"><summary>Quality &amp; folder for this request</summary><div class="form" id="advForm"><div class="spin" style="margin:12px auto"></div></div></details>`;
  const canReport = ["available", "partial"].includes(it.status);
  const here = x => ["available", "partial"].includes(x), canPull = ME.admin && (here(it.status) || here(it.status4k));

  const seasonsHTML = seasons.length ? `<h2 style="font-size:19px">Seasons ${pickable.length > 1 ? `<small><button id="pickAll">Select all</button></small>` : ""}</h2>
    <div class="seasons" id="seasons">${seasons.map(s => `<div class="sgroup"><div class="srow">
      <button class="season ${s.locked ? "locked" : ""}" data-n="${s.n}">
      <span class="check"></span><span class="name">Season ${s.n}</span><span class="muted" style="font-size:14px">${s.note}</span></button>
      <button class="epbtn" data-eps="${s.n}" aria-label="Episodes of season ${s.n}">Episodes</button></div><div class="eps" hidden></div></div>`).join("")}</div>
    ${pickable.length ? `<p class="foot" style="padding:0">Only want a few? Tap <b>Episodes</b> on a season.</p>` : ""}` : "";

  const streaming = it.streaming?.length ? `<div class="streaming">Streaming on ${it.streaming.map(p =>
    `<button data-prov="${p.id}" data-name="${esc(p.name)}" title="${esc(p.name)}">${p.logo ? `<img src="${esc(p.logo)}" alt="${esc(p.name)}">` : esc(p.name)}</button>`).join("")}</div>` : "";

  sh.innerHTML = `<button class="close" aria-label="Close">✕</button>
    <div class="hero" style="background-image:url('${bg(it.backdrop || it.poster || "")}')"></div>
    <div class="detail">
      <div class="head"><div class="poster">${it.poster ? `<img src="${esc(it.poster)}" alt="">` : ""}</div>
        <div><h3>${esc(it.title)}</h3><div class="meta">${meta}</div>
          ${it.genres?.length ? `<div class="meta">${it.genres.map(esc).join(", ")}</div>` : ""}
          ${lab ? `<span class="tag ${({available: "green", partial: "green", processing: "blue", pending: "orange"})[lab[1]]}">${it.status === "partial" ? "Partly available" : lab[0]}</span>` : ""}</div></div>
      ${it.overview ? `<p class="overview">${esc(it.overview)}</p>` : `<div style="height:14px"></div>`}
      <div class="chiprow"><span id="trailerSlot"></span><button class="chip" id="shareBtn">↗ Share</button></div>
      ${streaming}
      <div class="watch" id="watchSlot"></div>
      ${action}
      ${seasonsHTML}
      ${canReport ? `<button class="btn wide gray" id="reportBtn" style="margin-top:14px">Report a problem</button>
        ${it.issues ? `<p class="quota">${it.issues} open problem report${it.issues === 1 ? "" : "s"}</p>` : ""}<div id="reportBox"></div>` : ""}
      ${canPull ? `<button class="btn wide gray" id="pullBtn" style="margin-top:10px">Mark unavailable</button><div id="pullBox"></div>` : ""}
      <div id="extras"></div>
    </div>`;
  sh.querySelector(".close").onclick = closeSheet;
  paintInk(sh, it.poster);

  const rb = $("#reqBtn");
  const seasonBtns = () => $$(".season[data-n]:not(.locked)", sh);
  const chosen = () => seasonBtns().filter(b => b.classList.contains("on")).map(b => +b.dataset.n);
  const chosenEps = () => $$(".ep.on", sh).map(b => [+b.closest(".sgroup").querySelector("[data-n]").dataset.n, +b.dataset.e]);
  const sync = () => {
    if (!rb || !isTV) return;
    const eps = chosenEps();
    if (eps.length) {
      rb.disabled = false;
      rb.textContent = `${W("request")} ${eps.length === 1 ? `S${eps[0][0]} · E${eps[0][1]}` : `${eps.length} episodes of Season ${eps[0][0]}`}`;
      const pa = $("#pickAll"); if (pa) pa.textContent = "Select all";
      return;
    }
    const n = chosen().length;
    rb.disabled = !n;
    rb.textContent = !n ? "Pick the seasons you want" : n === pickable.length && brandNew ? `${W("request")} the whole show`
      : `${W("request")} ${n === 1 ? "Season " + chosen()[0] : n + " seasons"}`;
    const pa = $("#pickAll"); if (pa) pa.textContent = n === pickable.length ? "Clear" : "Select all";
  };
  const clearEps = () => $$(".ep.on", sh).forEach(x => x.classList.remove("on"));
  seasonBtns().forEach(b => b.onclick = () => { b.classList.toggle("on"); clearEps(); sync(); });
  const pa = $("#pickAll");
  if (pa) pa.onclick = () => { const all = chosen().length !== pickable.length; seasonBtns().forEach(b => b.classList.toggle("on", all)); clearEps(); sync(); };
  // episodes: open a season to pick single episodes (one season at a time)
  $$(".epbtn", sh).forEach(b => b.onclick = async () => {
    const box = b.closest(".sgroup").querySelector(".eps"), n = +b.dataset.eps;
    box.hidden = !box.hidden; b.classList.toggle("open", !box.hidden);
    if (box.hidden || box.dataset.loaded) return;
    box.innerHTML = `<div class="spin" style="margin:14px auto"></div>`;
    try {
      const d = await api(`/item/tv/${it.id}/season/${n}`);
      box.dataset.loaded = "1";
      box.innerHTML = d.episodes.map(e => `<button class="season ep ${e.status !== "none" ? "locked" : ""}" data-e="${e.n}">
        <span class="check"></span><span class="name">${e.n}. ${esc(e.title || "Episode " + e.n)}</span><span class="muted" style="font-size:13px">${epNote(e)}</span></button>`).join("")
        || `<p class="empty" style="padding:12px">No episodes listed yet.</p>`;
      $$(".ep:not(.locked)", box).forEach(x => x.onclick = () => {
        $$(".ep.on", sh).forEach(o => { if (o.closest(".eps") !== box) o.classList.remove("on"); });
        seasonBtns().forEach(sb => sb.classList.remove("on"));
        x.classList.toggle("on"); sync();
      });
    } catch (err) { box.innerHTML = `<p class="empty" style="padding:12px">${esc(err.message)}</p>`; }
  });
  sync();

  const doRequest = async (btn, is4k) => {
    const on = chosen(), eps = isTV ? chosenEps() : [];
    // the whole show for something brand new (so future seasons are followed too); otherwise exactly what was picked
    // 4K with nothing picked = the whole show in 4K (seasons already here in HD are locked above, but can still be wanted in 4K)
    const whole = !isTV || (brandNew && on.length === pickable.length) || (is4k && !on.length);
    const body = eps.length ? {type: it.type, id: it.id, seasons: [eps[0][0]], episodes: eps.map(e => e[1])}
      : {type: it.type, id: it.id, seasons: whole ? null : on};
    body.is4k = is4k;
    if (!is4k && $("#advForm select")) { body.profile = +$("#advForm [name=profile]").value; body.root = $("#advForm [name=root]").value; }
    const label = btn.textContent; btn.disabled = true; btn.textContent = "Requesting…";
    try {
      const r = await api("/requests", {body});
      toast(r.request.status === "pending" ? W("pendToast") : W("okToast")); haptic("success");
      ME = await api("/me").catch(() => ME);
      openItem(it.type, it.id); refreshBadge();
    } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = label; if (isTV) sync(); }
  };
  if (rb) rb.onclick = () => doRequest(rb, false);
  const r4 = $("#req4k");
  if (r4) r4.onclick = () => doRequest(r4, true);
  if (q && rb) rb.insertAdjacentHTML("afterend", `<p class="quota">${Math.max(0, q.limit - q.used)} of ${q.limit} ${isTV ? "TV" : "movie"} requests left (resets over ${q.days} days)</p>`);
  $("#adv")?.addEventListener("toggle", async e => {
    if (!e.target.open || $("#advForm").dataset.loaded) return;
    try {
      const o = await api(`/admin/options/${isTV ? "sonarr" : "radarr"}`);
      $("#advForm").dataset.loaded = "1";
      $("#advForm").innerHTML = `<label><span>Quality</span>${sel("profile", o.profiles.map(p => [p.id, p.name]), o.default_profile)}</label>
        <label><span>Folder</span>${sel("root", o.roots.map(r => [r, r]), o.default_root)}</label>`;
    } catch (err) { $("#advForm").innerHTML = `<p class="foot" style="padding:12px 14px">${esc(err.message)}</p>`; }
  });
  $("#pullBtn")?.addEventListener("click", () => {  // admins: take a bad copy away
    const box = $("#pullBox");
    if (box.innerHTML) { box.innerHTML = ""; return; }
    const both = here(it.status) && here(it.status4k);
    const withFiles = isTV ? (it.seasons || []).filter(s => s.have > 0) : [];
    box.innerHTML = `<div class="pull">
      ${both ? `<div class="form"><label><span>Which copy</span>${sel("is4k", [["0", "Regular"], ["1", "4K"]], "0")}</label></div>` : ""}
      ${withFiles.length > 1 ? `<div class="seasons">${withFiles.map(s => `<button class="season" data-pn="${s.n}"><span class="check"></span>
        <span class="name">Season ${s.n}</span><span class="muted" style="font-size:14px">${s.have} episode${s.have === 1 ? "" : "s"} here</span></button>`).join("")}</div>` : ""}
      <p class="foot" style="padding:0 0 10px">Removes the ${isTV ? "episode files" : "file"} from ${isTV ? "Sonarr" : "Radarr"} and your server.
        <b>Find a better copy</b> also blocks this release so it isn't grabbed again, then searches. <b>Just remove it</b> stops looking,
        so it can be requested again.</p>
      <div class="two"><button class="btn red" data-pull="1">Find a better copy</button><button class="btn gray" data-pull="0">Just remove it</button></div></div>`;
    $$("[data-pn]", box).forEach(b => b.onclick = () => b.classList.toggle("on"));
    $$("[data-pull]", box).forEach(b => b.onclick = async () => {
      const better = b.dataset.pull === "1", is4k = both ? $("[name=is4k]", box).value === "1" : !here(it.status);
      const seasons = !isTV ? null : withFiles.length > 1 ? $$("[data-pn].on", box).map(x => +x.dataset.pn) : withFiles.map(s => s.n);
      if (isTV && withFiles.length > 1 && !seasons.length) return toast("Pick the seasons to take away.");
      const what = isTV ? (seasons.length === 1 ? `season ${seasons[0]} of ${it.title}` : `${seasons.length} seasons of ${it.title}`) : it.title;
      if (!confirm(`${better ? "Delete this copy of" : "Delete"} ${what}${is4k ? " (4K)" : ""}${better ? " and look for a better one" : ""}?`)) return;
      $$("[data-pull]", box).forEach(x => x.disabled = true);
      try {
        await api("/admin/unavailable", {body: {type: it.type, id: it.id, seasons, is4k, better}});
        toast(better ? "Removed. Looking for a better copy." : "Removed. It can be requested again.");
        openItem(it.type, it.id);
      } catch (err) { toast(err.message); $$("[data-pull]", box).forEach(x => x.disabled = false); }
    });
  });
  $("#reportBtn")?.addEventListener("click", () => {
    const box = $("#reportBox");
    if (box.innerHTML) { box.innerHTML = ""; return; }
    const have = (it.seasons || []).filter(x => x.have);
    box.innerHTML = `<form class="issue-form" id="issueForm">
      <div class="seg" id="issueKind">${[["video", "Video"], ["audio", "Audio"], ["subtitles", "Subtitles"], ["other", "Other"]].map(([k, l], i) =>
        `<button type="button" data-k="${k}" class="${i ? "" : "on"}">${l}</button>`).join("")}</div>
      ${isTV && have.length ? `<div class="two"><select name="season"><option value="">Any season</option>${have.map(x => `<option value="${x.n}">Season ${x.n}</option>`).join("")}</select>
        <input name="episode" type="number" min="1" placeholder="Episode (optional)" inputmode="numeric"></div>` : ""}
      <textarea name="message" maxlength="1000" placeholder="What's wrong? e.g. audio out of sync, missing subtitles"></textarea>
      <button class="btn" type="submit">Send report</button></form>`;
    $("#issueKind").onclick = ev => { const b = ev.target.closest("button"); if (b) $$("#issueKind button").forEach(x => x.classList.toggle("on", x === b)); };
    $("#issueForm").onsubmit = async ev => {
      ev.preventDefault();
      const f = new FormData(ev.target), btn = ev.target.querySelector("[type=submit]");
      btn.disabled = true;
      try {
        await api("/issues", {body: {type: it.type, id: it.id, kind: $("#issueKind .on").dataset.k, message: f.get("message") || "",
          season: f.get("season") ? +f.get("season") : null, episode: f.get("episode") ? +f.get("episode") : null}});
        toast("Thanks. The owner will take a look."); box.innerHTML = ""; refreshBadge();
      } catch (err) { toast(err.message); btn.disabled = false; }
    };
  });
  $("#shareBtn")?.addEventListener("click", () => shareTitle(it));
  if (it.tmdb) loadExtras(it);
  if (["available", "partial"].includes(it.status)) loadWatch(it);
  const ab = sh.querySelector("[data-approve]");
  if (ab) ab.onclick = async () => { ab.disabled = true; try { await api(`/requests/${ab.dataset.approve}/approve`, {method: "POST"}); toast("Approved"); openItem(it.type, it.id); refreshBadge(); } catch (e) { toast(e.message); ab.disabled = false; } };
}

/* ---------- requests ---------- */
let REQ_SCOPE = null;
$("#reqSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  REQ_SCOPE = b.dataset.s; $$("#reqSeg button").forEach(x => x.classList.toggle("on", x === b)); loadRequests();
});
const KINDS = {video: "Video", audio: "Audio", subtitles: "Subtitles", other: "Other"};
function issueRow(i, admin) {
  const where = i.season ? ` · S${i.season}${i.episode ? " E" + i.episode : ""}` : "";
  return `<div class="li" data-iid="${i.id}">
    <button class="thumb" data-type="${i.type}" data-id="${i.media_id}">${i.poster ? `<img data-src="${esc(i.poster)}" alt="">` : ""}</button>
    <div class="body"><div class="t">${esc(i.title)}${where}</div>
      <div class="s">${KINDS[i.kind] || i.kind}${admin ? " · " + esc(i.reported_by.name) : ""} · ${ago(i.created)}</div>
      ${i.message ? `<div class="s wrap">“${esc(i.message)}”</div>` : ""}
      ${i.reply ? `<div class="s wrap" style="color:var(--text)">↳ ${esc(i.reply)}</div>` : ""}
      <span class="tag ${i.status === "open" ? "orange" : "green"}">${i.status === "open" ? "Open" : "Fixed"}</span></div>
    <div class="acts">
      ${admin && i.status === "open" ? `<button class="btn small gray" data-iact="reply">Reply</button><button class="btn small green" data-iact="resolve">Fixed</button>` : ""}
      ${i.status !== "open" || !admin ? `<button class="btn small gray" data-iact="delete">Remove</button>` : ""}
    </div></div>`;
}
async function loadIssues() {
  try {
    const {issues} = await api("/issues?status=all");
    issues.sort((a, b) => (a.status !== "open") - (b.status !== "open"));
    $("#reqBody").innerHTML = issues.length ? `<div class="list">${issues.map(i => issueRow(i, ME.admin)).join("")}</div>`
      : `<p class="empty">${ME.admin ? "No problem reports. Nice." : "Something wrong with a movie or episode? Open it and tap Report a problem."}</p>`;
  } catch (e) { $("#reqBody").innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
}
async function loadRequests() {
  const admin = ME.admin;
  const tabs = admin ? [["pending", "Pending"], ["all", "Everyone"], ["mine", "Mine"], ["issues", "Problems"]] : [["mine", "My requests"], ["issues", "Problems"]];
  if (!REQ_SCOPE) REQ_SCOPE = tabs[0][0];
  $("#reqSeg").innerHTML = tabs.map(([k, l]) => `<button data-s="${k}" class="${k === REQ_SCOPE ? "on" : ""}">${l}</button>`).join("");
  if (REQ_SCOPE === "issues") return loadIssues();
  const path = !admin ? "/requests?scope=mine" : REQ_SCOPE === "pending" ? "/requests?scope=all&status=pending" : `/requests?scope=${REQ_SCOPE}`;
  try {
    const {requests} = await api(path);
    $("#reqBody").innerHTML = requests.length ? `<div class="list">${requests.map(r => reqRow(r, admin)).join("")}</div>`
      : `<p class="empty">${admin && REQ_SCOPE === "pending" ? "Nothing waiting for approval." : "No requests yet. Find something in Search."}</p>`;
  } catch (e) { $("#reqBody").innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
}
$("#reqBody").addEventListener("click", async e => {
  const ib = e.target.closest("[data-iact]");
  if (ib) {
    const iid = ib.closest("[data-iid]").dataset.iid, act = ib.dataset.iact;
    let req;
    if (act === "reply") { const t = prompt("Reply to the person who reported it"); if (!t) return; req = api(`/issues/${iid}`, {body: {reply: t}}); }
    if (act === "resolve") { const t = prompt("Fixed! Add a note? (optional)"); if (t === null) return; req = api(`/issues/${iid}`, {body: {status: "resolved", ...(t ? {reply: t} : {})}}); }
    if (act === "delete") { if (!confirm("Remove this report?")) return; req = api(`/issues/${iid}`, {method: "DELETE"}); }
    ib.disabled = true;
    try { await req; toast({reply: "Reply sent", resolve: "Marked fixed", delete: "Removed"}[act]); } catch (err) { toast(err.message); }
    loadIssues(); refreshBadge();
    return;
  }
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "opts") return toggleApproveOpts(b.closest("[data-rid]"));
  if (b.dataset.act === "approve-opts") {
    const panel = b.closest(".opt-panel"), rid = panel.previousElementSibling.dataset.rid;
    b.disabled = true;
    try {
      await api(`/requests/${rid}/approve`, {body: {profile: +$("[name=profile]", panel).value, root: $("[name=root]", panel).value}});
      toast("Approved. Sent to download.");
    } catch (err) { toast(err.message); }
    loadRequests(); refreshBadge();
    return;
  }
  const rid = b.closest("[data-rid]").dataset.rid, act = b.dataset.act;
  let body;
  if (act === "deny") { const note = prompt("Reason (optional)"); if (note === null) return; body = {note: note || null}; }
  if (act === "cancel" && !confirm("Cancel this request?")) return;
  b.disabled = true;
  try {
    await api(act === "cancel" ? `/requests/${rid}` : `/requests/${rid}/${act}`, {method: act === "cancel" ? "DELETE" : "POST", body});
    toast({approve: "Approved. Sent to download.", deny: "Declined", cancel: "Cancelled"}[act]);
  } catch (err) { toast(err.message); }
  loadRequests(); refreshBadge();
});
async function toggleApproveOpts(row) {
  if (row.nextElementSibling?.classList.contains("opt-panel")) return row.nextElementSibling.remove();
  const srv = (row.dataset.kind === "movie" ? "radarr" : "sonarr") + (row.dataset.k4 === "1" ? "4k" : "");
  row.insertAdjacentHTML("afterend", `<div class="opt-panel"><div class="spin" style="margin:8px auto"></div></div>`);
  const panel = row.nextElementSibling;
  try {
    const o = await api(`/admin/options/${srv}`);
    panel.innerHTML = `<div class="form"><label><span>Quality</span>${sel("profile", o.profiles.map(p => [p.id, p.name]), o.default_profile)}</label>
      <label><span>Folder</span>${sel("root", o.roots.map(r => [r, r]), o.default_root)}</label></div>
      <button class="btn small green" data-act="approve-opts">Approve with these</button>`;
  } catch (e) { panel.innerHTML = `<p class="foot">${esc(e.message)}</p>`; }
}
async function refreshBadge() {
  if (!ME?.admin) return;
  try {
    const [{requests}, {issues}] = await Promise.all([api("/requests?scope=all&status=pending"), api("/issues?status=open")]);
    const n = requests.length + issues.length;
    const b = $("#pendBadge"); b.hidden = !n; b.textContent = n;
  } catch {}
}

/* ---------- home layout (per person, saved to the account) ---------- */
const HOME_LABELS = {featured: "Featured banner", office: "The Office (live building)", live: "Live TV (channels from your library)", requests: "Your requests", discover: "Swipe & Movie match", foryou: "Because you watched…",
                     movies: "Now playing (movies on the server)", tv: "New episodes", trending: "Top 10 this week",
                     theaters: "In theaters", popular: "Popular movies & shows", upcoming: "Coming to theaters",
                     genres: "Categories (new ones each day)", shelves: "Seasonal genres (Kids, Christmas, Horror…)",
                     streaming: "Streaming services"};
function homeLayoutHTML() {
  if (NATIVE()) HOME_LABELS.live = "Live TV (on Apple TV and the website)";
  const on = ME.prefs?.home || [], rows = [...on, ...Object.keys(HOME_LABELS).filter(k => !on.includes(k))];
  const off = ME.home_off || [];  // turned off for everyone by the owner: not shown here, but kept in your layout for if it comes back
  return `<div class="list" id="homeLayout">${rows.filter(k => HOME_LABELS[k] && !off.includes(k)).map(k => `<div class="li" data-hk="${k}">
    <span class="switch"><input type="checkbox" ${on.includes(k) ? "checked" : ""} aria-label="Show ${HOME_LABELS[k]}"><i></i></span>
    <div class="body"><div class="t">${HOME_LABELS[k]}</div></div>
    <div class="acts"><button class="btn small gray" data-hm="-1" aria-label="Move up">↑</button><button class="btn small gray" data-hm="1" aria-label="Move down">↓</button></div></div>`).join("")}</div>`;
}
function wireHomeLayout() {
  const box = $("#homeLayout");

/* Trailers that play by themselves: muted, looping, hidden until they really play (YouTube refuses some), paused whenever

const SPEAKER = on => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/>${on

async function ytInto(host, url, still, muteBtn) {
  const key = url?.split("v=")[1];
  if (!key || !host || !autoplayOK()) return;
  try {
    const YT = await youtube();
    if (!host.isConnected || !still()) return;
    host.innerHTML = "<div></div>";
    let ours = false;
    const player = new YT.Player(host.firstChild, {videoId: key, host: "https://www.youtube-nocookie.com", width: "100%", height: "100%",
      playerVars: {autoplay: 1, mute: 1, controls: 0, playsinline: 1, loop: 1, playlist: key, modestbranding: 1, rel: 0, iv_load_policy: 3, disablekb: 1, cc_load_policy: 0, cc_lang_pref: "zxx"},
      events: {onReady: e => { e.target.mute(); try { e.target.unloadModule("captions"); } catch {} if (still()) e.target.playVideo(); },

               onError: () => { host.innerHTML = ""; host.classList.remove("on"); if (muteBtn) muteBtn.hidden = true; }}});
    if (muteBtn) muteBtn.onclick = e => {
      e.stopPropagation();
      const was = player.isMuted();
      if (was) player.unMute(); else player.mute();
      muteBtn.innerHTML = SPEAKER(was); muteBtn.setAttribute("aria-label", was ? "Mute" : "Sound on");
    };
    const t = setInterval(() => {
      if (!host.isConnected) { clearInterval(t); try { player.destroy(); } catch {} return; }
      const st = player.getPlayerState?.();
      if (!still()) { if (st === 1) { player.pauseVideo(); ours = true; } }
      else if (ours && st === 2) { player.playVideo(); ours = false; }

}
async function playTrailer(url, stillTop) {  // muted, looping trailer on the top card; stays hidden until it actually plays

      playerVars: {autoplay: 1, mute: 1, controls: 0, playsinline: 1, loop: 1, playlist: key, modestbranding: 1, rel: 0, iv_load_policy: 3},
      events: {onReady: e => { e.target.mute(); e.target.playVideo(); },

async function shareWrapped(w) {  // a 1080×1920 story image in the current theme's colors
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  const c = document.createElement("canvas"); c.width = 1080; c.height = 1920;
  const g = c.getContext("2d");
  const grd = g.createLinearGradient(0, 0, 1080, 1920);
  grd.addColorStop(0, v("--accent") || "#e50914"); grd.addColorStop(1, v("--accent2") || "#8a0b12");
  g.fillStyle = grd; g.fillRect(0, 0, 1080, 1920);
  g.fillStyle = "rgba(0,0,0,.3)"; g.fillRect(0, 0, 1080, 1920);
  const font = (wt, px) => g.font = `${wt} ${px}px -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif`;
  const fit = (t, max) => { while (g.measureText(t).width > max && t.length > 4) t = t.slice(0, -2).trimEnd() + "…"; return t; };
  g.fillStyle = "#fff";
  font(700, 42); g.globalAlpha = .85; g.fillText(`${APP().toUpperCase()} WRAPPED ${w.year}`, 90, 190); g.globalAlpha = 1;
  font(800, 92); g.fillText(fit(`${ME.name}'s year`, 900), 90, 320);
  const stat = (val, label, y) => { font(800, 160); g.fillText(val, 90, y); font(600, 46); g.globalAlpha = .85; g.fillText(label, 94, y + 66); g.globalAlpha = 1; };
  stat(w.hours.toLocaleString(), "hours watched", 620);
  stat(String(w.movies), w.movies === 1 ? "movie" : "movies", 900);
  stat(w.episodes.toLocaleString(), "episodes", 1180);
  if (w.top_shows.length) {
    font(700, 42); g.globalAlpha = .85; g.fillText("TOP SHOWS", 90, 1390); g.globalAlpha = 1;
    font(700, 56); w.top_shows.slice(0, 3).forEach((t, n) => g.fillText(fit(`${n + 1}. ${t.title}`, 900), 90, 1480 + n * 84));
  }
  if (w.genres.length) { font(600, 46); g.fillText(fit(`Mostly ${w.genres.slice(0, 2).map(x => x.name).join(" & ")}`, 900), 90, 1800); }
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  const file = new File([blob], `nuniflix-wrapped-${w.year}.png`, {type: "image/png"});
  if (navigator.canShare?.({files: [file]})) {
    try { await navigator.share({files: [file], title: `My ${APP()} Wrapped`}); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

const b64u = s => Uint8Array.from(atob((s + "===".slice((s.length + 3) % 4)).replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone;
async function pushSub() {
  const reg = await navigator.serviceWorker.getRegistration("/");
  return reg ? reg.pushManager.getSubscription() : null;
}
async function setupPushSwitch() {
  const sw = $("#fNotif [name=push]"), note = $("#pushNote");
  if (NATIVE()) {  // the iPhone app: Apple's own notifications (server: apns.py)
    const {configured} = await api("/push/apns").catch(() => ({configured: false}));
    if (!configured) { sw.disabled = true; note.textContent = ME.owner ? "Add your Apple push key in Settings → System → iPhone app notifications first." : `The owner hasn't set up iPhone notifications for ${APP()} yet.`; return; }
    sw.checked = !!window.NF_APP.pushOn && ME.prefs?.push !== false;
    sw.onchange = () => {
      sw.disabled = true;
      window.nfPushDone = async (ok, msg) => {  // the app calls this once iOS has answered
        sw.disabled = false;
        if (!ok) { sw.checked = false; toast(msg || "Notifications are off for this app in iPhone Settings."); return; }
        window.NF_APP.pushOn = sw.checked;
        try {
          await api("/me/prefs", {body: {push: sw.checked}});
          if (sw.checked) { await api("/push/test", {method: "POST"}); toast("Turned on. A test notification is on its way."); }
        } catch (e) { toast(e.message); }
      };
      native({action: sw.checked ? "pushOn" : "pushOff"});
    };
    return;
  }
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !isSecureContext) {
    sw.disabled = true;
    note.textContent = !isSecureContext ? `Phone notifications need ${APP()} on a secure (https) address.`
      : /iPhone|iPad/.test(navigator.userAgent) && !standalone() ? `On iPhone: tap Share → Add to Home Screen, open ${APP()} from there, then turn this on.`
      : "This browser can't do notifications.";
    return;
  }
  sw.checked = !!(await pushSub().catch(() => null));
  sw.onchange = async () => {
    sw.disabled = true;
    try {
      if (sw.checked) {
        const reg = await navigator.serviceWorker.register("/sw.js");
        if (await Notification.requestPermission() !== "granted") throw new Error(`Notifications are turned off for ${APP()} in your settings.`);
        const {key} = await api("/push/key");
        const sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64u(key)});
        await api("/push/subscribe", {body: sub.toJSON()});
        await api("/me/prefs", {body: {push: true}});
        await api("/push/test", {method: "POST"});
        toast("Turned on. A test notification is on its way.");
      } else {
        const sub = await pushSub();
        if (sub) { await api("/push/unsubscribe", {body: {endpoint: sub.endpoint}}); await sub.unsubscribe(); }
      }
    } catch (e) { toast(e.message); sw.checked = !sw.checked; }
    sw.disabled = false;
  };
}

/* Plex, Discord and Fluxer all sign in in a separate window while we poll with a secret state. */
async function popupSignIn(prefix) {
  const win = window.open("", "nfauth", "width=600,height=760");  // open now so popup blockers allow it
  try {
    const {state, url} = await api(prefix + "/start", {body: {}, quiet: true});
    if (win) win.location = url; else location.href = url;
    const plex = prefix.endsWith("/plex");
    const check = () => api(prefix + "/check", {body: {state, device: device(), pick: plex}, quiet: true});
    const done = r => r.pick ? whoPick(prefix, r) : r;  // a Plex Home: choose the profile first
    const t0 = Date.now();
    while (Date.now() - t0 < 300000) {
      await new Promise(r => setTimeout(r, 1500));
      const r = await check();
      if (r._status === 200) { win?.close(); return done(r); }
      if (win && win.closed && Date.now() - t0 > 4000) {
        await new Promise(r => setTimeout(r, 1500));
        const last = await check();
        if (last._status === 200) return done(last);
        throw new Error("The sign-in window closed before finishing.");
      }
    }
    throw new Error("Sign-in timed out.");
  } catch (e) { win?.close(); throw e; }
}
/* Plex Home: the account that signed in has other profiles (family, kids). Pick one, with its PIN if it has one.
   Resolves with the sign-in (or link) result; rejects if they back out. */
function whoPick(prefix, {pick, state}) {
  return new Promise((resolve, reject) => {
    const el = document.createElement("div"); el.className = "who"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true");
    const close = () => el.remove();
    for (const u of pick) if (!/^https:\/\/[^'"()\s\\]+$/.test(u.thumb || "")) u.thumb = null;  // only plain https pictures go in the style
    const people = () => {
      el.innerHTML = `<div class="card"><h2>Who's watching?</h2><p class="muted">This Plex account has a few profiles. Pick yours.</p>
        <div class="ppl">${pick.map((u, i) => `<button class="p" data-i="${i}"><span class="av" ${u.thumb ? `style="background-image:url('${esc(u.thumb)}')"` : ""}>${u.thumb ? "" : esc((u.name[0] || "?").toUpperCase())}</span>
          <span class="nm">${esc(u.name)}</span><span class="tg">${[u.admin && "Owner", u.kid && "Kids", u.pin && "🔒 PIN"].filter(Boolean).join(" · ") || "&nbsp;"}</span></button>`).join("")}</div>
        <p class="err" id="whoErr"></p><button class="btn small gray" data-x>Cancel</button></div>`;
      el.querySelector(".p")?.focus();
    };
    const go = async (u, pin, btn) => {
      if (btn) btn.disabled = true;
      try { const r = await api(prefix + "/pick", {body: {state, user: u.id, pin: pin || null, device: device()}, quiet: true}); close(); resolve(r); }
      catch (e) {
        if (/expired|Too many/.test(e.message)) { close(); reject(e); return; }
        const err = el.querySelector("#whoErr"); if (err) err.textContent = e.message;
        if (btn) btn.disabled = false;
        el.querySelector("input")?.select();
      }
    };
    const askPin = u => {
      el.innerHTML = `<div class="card"><h2>${esc(u.name)}</h2><p class="muted">Enter this profile's Plex PIN.</p>
        <form><input class="input" name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" required>
        <button class="btn" type="submit">Continue</button></form><p class="err" id="whoErr"></p><button class="btn small gray" data-back>Back</button></div>`;
      const f = el.querySelector("form"), inp = f.pin; inp.focus();
      inp.oninput = () => { if (inp.value.length === 4) f.requestSubmit(); };
      f.onsubmit = ev => { ev.preventDefault(); go(u, inp.value, f.querySelector("button")); };
    };
    el.onclick = e => {
      const p = e.target.closest("[data-i]");
      if (p) { const u = pick[+p.dataset.i]; u.pin ? askPin(u) : go(u, null, p); }
      else if (e.target.closest("[data-back]")) people();
      else if (e.target.closest("[data-x]")) { close(); reject(new Error("Sign-in cancelled.")); }
    };
    people(); document.body.append(el);
  });
}

async function stest(kind, root) {
  const form = $(`form[data-kind=${kind}]`, root), out = $(`[data-out=${kind}]`, root);
  out.className = "foot"; out.textContent = "Checking…";
  try {
    const r = await api("/setup/test", {body: {kind, ...formObj(form)}, quiet: true});
    out.textContent = (r.ok ? "✓ " : "✕ ") + r.message; out.classList.add(r.ok ? "ok" : "bad");
    SETUP.ok[kind] = r.ok;
    if (r.ok && r.options) {  // Radarr/Sonarr: show quality + folder pickers
      const c = SETUP.cfg[kind];
      $$(".opt", form).forEach(l => l.remove());
      form.insertAdjacentHTML("beforeend", `
        <label class="opt"><span>Quality</span>${sel("profile", r.options.profiles.map(p => [p.id, p.name]), c.profile)}</label>
        <label class="opt"><span>Folder</span>${sel("root", r.options.roots.map(x => [x, x]), c.root)}</label>` + (kind === "radarr"
        ? `<label class="opt"><span>Grab when</span>${sel("availability", [["announced", "Announced"], ["inCinemas", "In cinemas"], ["released", "Released"]], c.availability)}</label>`
        : `<label class="opt"><span style="width:auto">Season folders</span>${swi("season_folders", c.season_folders)}</label>`));
    }
    if (kind === "fluxer" && r.servers?.length) {  // Fluxer: pick the server from the ones the bot is in
      const cur = $("[name=guild_id]", form).value;
      $("#fxGuildBox").innerHTML = sel("guild_id", [["", "Pick a server"], ...r.servers.map(x => [x.id, x.name])], cur);
      $("#fxGuildBox select").onchange = () => { $("#fxRoleBox").innerHTML = `<input name="role_id" value="" placeholder="Pick the server first">`; stest("fluxer", root); };
    }
    if ((kind === "discord" || kind === "fluxer") && r.ok && r.roles) {  // a bot token: pick the role from a list
      const cur = $("[name=role_id]", form).value;
      $(kind === "fluxer" ? "#fxRoleBox" : "#roleBox").innerHTML = sel("role_id", [["", "Anyone in the server"], ...r.roles.map(x => [x.id, x.name])], cur);
    }
    return r;
  } catch (e) { out.textContent = "✕ " + e.message; out.classList.add("bad"); SETUP.ok[kind] = false; }
}

}

const ex = port => `http://192.168.1.10:${port}`;

const STEPS = {
  welcome: {

      <div class="picks">${pick("jellyfin", "J", "username + password")}${pick("plex", "▶", "plex.tv account")}${pick("discord", "D", "server members")}${pick("fluxer", "F", "server members")}</div>

      <div data-svc="jellyfin" ${u.jellyfin ? "" : "hidden"}><h2>Jellyfin</h2>
        <form class="form" data-kind="jellyfin">
          <label><span>Address</span><input name="url" value="${esc(c.jellyfin.url)}" placeholder="${ex(8096)}" autocapitalize="none" autocorrect="off" inputmode="url"></label>
          <label><span>Public address</span><input name="public_url" value="${esc(c.jellyfin.public_url)}" placeholder="optional" autocapitalize="none" autocorrect="off" inputmode="url"></label>

        </form>
        <p class="foot" data-out="jellyfin">The address ${APP()} uses to reach Jellyfin on your network. The API key is optional (Jellyfin Dashboard → API Keys).</p>
        <button class="btn small gray" data-test="jellyfin">Check connection</button></div>

      <div data-svc="plex" ${u.plex ? "" : "hidden"}><h2>Plex</h2>
        <form class="form" data-kind="plex">
          <label><span>Address</span><input name="url" value="${esc(c.plex.url)}" placeholder="${ex(32400)}" autocapitalize="none" autocorrect="off" inputmode="url"></label>
        </form>
        <p class="foot" data-out="plex">Your Plex server on your network. Anyone you share your Plex libraries with can sign in.</p>
        <button class="btn small gray" data-test="plex">Check connection</button></div>

      <div data-svc="site" ${u.discord || u.fluxer ? "" : "hidden"}><h2>${APP()} address</h2>
        <form class="form" id="siteForm"><label><span>${APP()} address</span><input name="site_url" value="${esc(c.site_url || location.origin)}" autocapitalize="none" autocorrect="off" inputmode="url"></label></form>
        <p class="foot">The one address Discord and Fluxer send people back to. Use the address you open ${APP()} at (e.g. ${esc(location.origin)} at home, or your https name if you have one).</p></div>

      <div data-svc="discord" ${u.discord ? "" : "hidden"}><h2>Discord</h2>
        <ol class="how">
          <li>Open <a href="https://discord.com/developers/applications" target="_blank" rel="noopener">discord.com/developers</a> and make a <b>New Application</b>.</li>
          <li>Open its <b>OAuth2</b> page. Copy the <b>Client ID</b>, press <b>Reset Secret</b> and copy the <b>Client Secret</b>.</li>
          <li>Still on OAuth2, under <b>Redirects</b> press <b>Add Redirect</b>, paste this exactly, and <b>Save Changes</b>:<br><span class="code" id="redirectUrl">${esc((c.site_url || location.origin) + "/api/auth/discord/callback")}</span><br>
            Paste it, don't open it. You don't need the <i>OAuth2 URL Generator</i>: ${APP()} builds the sign-in link itself and only asks Discord for the person's name and their roles in your server.</li>
          <li>In the Discord app, turn on <b>Developer Mode</b> (User Settings → Advanced). Right-click your server's icon → <b>Copy Server ID</b>.</li>
          <li>For a required role: Server Settings → Roles → right-click the role → <b>Copy Role ID</b>. Leave it blank to let anyone in the server in.</li>
          <li>Optional, for Discord DMs and picking the role from a list: open the <b>Bot</b> page, press <b>Reset Token</b> and copy it. No privileged intents and no permissions are needed. Then press <b>Invite the bot</b> below.</li>
        </ol>
        <form class="form" data-kind="discord">
          <label><span>Client ID</span><input name="client_id" value="${esc(d.client_id)}" inputmode="numeric" autocomplete="off"></label>
          <label><span>Client secret</span><input name="secret" type="password" placeholder="${saved(d, "secret", "Paste secret")}" autocomplete="off"></label>
          <label><span>Server ID</span><input name="guild_id" value="${esc(d.guild_id)}" inputmode="numeric" autocomplete="off"></label>
          <label><span>Bot token</span><input name="bot_token" type="password" placeholder="${saved(d, "bot_token", "optional")}" autocomplete="off"></label>
          <label><span>Needs role</span><span id="roleBox" style="flex:1;display:flex;width:auto"><input name="role_id" value="${esc(d.role_id)}" placeholder="Role ID · blank = anyone" inputmode="numeric" autocomplete="off"></span></label>
        </form>
        <form class="form" id="dcLink"><label><span style="width:auto">Needs Plex or Jellyfin too</span>${swi("discord_needs_link", c.discord_needs_link !== false)}</label></form>
        <p class="foot" style="margin-top:6px">On: Discord works once someone has signed in with Plex or Jellyfin (so they have access to your server) and linked Discord under You. New people can't start with Discord.</p>
        <p class="foot" data-out="discord">Only people in that Discord server (with that role, if you pick one) can sign in. A Discord account is only ever admin if you link it to your own Plex or Jellyfin account.</p>
        <button class="btn small gray" data-test="discord">Check connection</button>
        <button class="btn small gray" id="inviteBot" style="margin-left:6px">Invite the bot</button></div>

      <div data-svc="fluxer" ${u.fluxer ? "" : "hidden"}><h2>Fluxer</h2>
        <ol class="how">
          <li>In Fluxer, open the developer page where you made your bot (NuniBot works) and pick it, or make a new application.</li>
          <li>Copy its <b>Client ID</b> and <b>Client Secret</b> (reset the secret if it's hidden), and the <b>Bot Token</b>.</li>
          <li>Under <b>Redirect URIs</b> add this exactly and save:<br><span class="code" id="fxRedirect">${esc((c.site_url || location.origin) + "/api/auth/fluxer/callback")}</span><br>
            Paste it, don't open it. ${APP()} only asks Fluxer who the person is. The bot checks they're in your server and have the role.</li>
          <li>The bot has to be in your Fluxer server. Press <b>Check connection</b>, then pick the server and the role.</li>
        </ol>
        <form class="form" data-kind="fluxer">
          <label><span>Fluxer address</span><input name="url" value="${esc(f.url)}" placeholder="https://chat.example.com" autocapitalize="none" autocorrect="off" inputmode="url"></label>
          <label><span>Client ID</span><input name="client_id" value="${esc(f.client_id)}" inputmode="numeric" autocomplete="off"></label>
          <label><span>Client secret</span><input name="secret" type="password" placeholder="${saved(f, "secret", "Paste secret")}" autocomplete="off"></label>
          <label><span>Bot token</span><input name="bot_token" type="password" placeholder="${saved(f, "bot_token", "Paste token")}" autocomplete="off"></label>
          <label><span>Server</span><span id="fxGuildBox" style="flex:1;display:flex;width:auto"><input name="guild_id" value="${esc(f.guild_id)}" placeholder="Check connection to pick" inputmode="numeric" autocomplete="off"></span></label>
          <label><span>Needs role</span><span id="fxRoleBox" style="flex:1;display:flex;width:auto"><input name="role_id" value="${esc(f.role_id)}" placeholder="Role ID · blank = anyone" inputmode="numeric" autocomplete="off"></span></label>
        </form>
        <form class="form" id="fxLink"><label><span style="width:auto">Needs Plex or Jellyfin too</span>${swi("fluxer_needs_link", !!c.fluxer_needs_link)}</label></form>
        <p class="foot" style="margin-top:6px">Off: anyone in the server with the role can make an account with Fluxer. On: Fluxer only works once someone has linked it to a Plex or Jellyfin sign-in under You.</p>
        <p class="foot" data-out="fluxer">Only people in that Fluxer server (with that role, if you pick one) can sign in, checked every time they sign in. A Fluxer account is only ever admin if you link it to your own Plex or Jellyfin account.</p>
        <button class="btn small gray" data-test="fluxer">Check connection</button></div>`;
    },
    init: r => {
      wireTests(r);
      $$("[data-pick]", r).forEach(b => b.onclick = () => {
        const k = b.dataset.pick; SETUP.use[k] = !SETUP.use[k];
        b.classList.toggle("on", SETUP.use[k]); $(`[data-svc=${k}]`, r).hidden = !SETUP.use[k];
        $("[data-svc=site]", r).hidden = !(SETUP.use.discord || SETUP.use.fluxer);
      });
      for (const k of ["jellyfin", "plex", "discord", "fluxer"]) if (SETUP.use[k]) stest(k, r);  // show what's already working
      $("#siteForm [name=site_url]", r).oninput = e => { const b = e.target.value.trim().replace(/\/+$/, "");
        $("#redirectUrl").textContent = b + "/api/auth/discord/callback"; $("#fxRedirect").textContent = b + "/api/auth/fluxer/callback"; };
      $("#inviteBot", r).onclick = () => {  // bot scope only, no permissions, straight into this server; no redirect involved
        const f = $("form[data-kind=discord]", r), id = $("[name=client_id]", f).value.trim(), g = $("[name=guild_id]", f).value.trim();
        if (!id || !g) return toast("Fill in the Client ID and Server ID first.");
        window.open(`https://discord.com/oauth2/authorize?client_id=${encodeURIComponent(id)}&scope=bot&permissions=0&guild_id=${encodeURIComponent(g)}&disable_guild_select=true`, "_blank", "noopener");
      };
    },
    next: async r => {
      const u = SETUP.use;
      if (!u.jellyfin && !u.plex) throw new Error("Pick Jellyfin or Plex (or both). That's how you'll sign in as the admin.");
      for (const k of ["jellyfin", "plex", "discord", "fluxer"]) {
        if (u[k] && !SETUP.ok[k] && !(await stest(k, r))?.ok) throw new Error(`${NAMES[k]} isn't connecting yet. Check its settings.`);
      }
      if (u.fluxer && !$("form[data-kind=fluxer] [name=guild_id]", r).value) throw new Error("Pick the Fluxer server people have to be in.");
      const body = {jellyfin_login: u.jellyfin, plex_login: u.plex, discord_login: u.discord, discord_needs_link: $("[name=discord_needs_link]", r).checked,
                    fluxer_login: u.fluxer, fluxer_needs_link: $("[name=fluxer_needs_link]", r).checked};
      if (u.discord || u.fluxer) body.site_url = $("#siteForm [name=site_url]", r).value.trim();
      for (const k of ["jellyfin", "plex", "discord", "fluxer"]) if (u[k]) body[k] = formObj($(`form[data-kind=${k}]`, r));
      await saveSetup(body);
    },
  },

  owner: {
    html: () => {
      const c = SETUP.cfg, plex = c.plex_login && c.plex.url, jf = c.jellyfin_login && c.jellyfin.url, have = SETUP.owners.length;
      return `<h1>${have ? "Your admin account" : "Now sign in as you"}</h1>
      <p class="lead">Use the account that owns your ${plex && jf ? "Plex or Jellyfin" : plex ? "Plex" : "Jellyfin"} server. Only that account becomes the ${APP()} admin.
        ${plex ? "For Plex that means the server owner." : ""} ${jf ? "For Jellyfin it has to be an administrator." : ""}</p>
      ${SETUP.owners.map(o => `<div class="owner-ok"><div class="avatar" style="width:38px;height:38px;font-size:16px">${esc(o.name[0]?.toUpperCase())}</div>
        <div style="flex:1;min-width:0"><div style="font-weight:600">${esc(o.name)}</div><div class="muted" style="font-size:13px">${SRC[o.source] || o.source} · Admin</div></div>
        <span style="color:var(--green);font-size:22px;font-weight:700">✓</span></div>`).join("")}
      ${plex ? `<button class="btn plex wide" id="ownPlex" style="margin-top:10px">${have ? "Add your Plex account too" : "Sign in with Plex"}</button>` : ""}
      ${jf ? `${plex ? `<div class="or">or</div>` : ""}<form id="ownJf" style="display:grid;gap:10px;margin-top:10px">
        <input class="input" name="username" placeholder="Jellyfin admin username" autocomplete="username" autocapitalize="none" required>
        <input class="input" name="password" type="password" placeholder="Password" autocomplete="current-password">
        <button class="btn wide gray" type="submit">${have ? "Add your Jellyfin account too" : "Sign in with Jellyfin"}</button></form>` : ""}
      <p class="err" id="ownErr"></p>`;
    },
    init: r => {
      const done = async () => { await loadSetupCfg(); renderSetup(); };
      $("#ownPlex", r)?.addEventListener("click", async e => {
        const b = e.currentTarget; b.disabled = true; b.textContent = "Waiting for Plex…"; $("#ownErr").textContent = "";
        try { await popupSignIn("/setup/owner/plex"); await done(); }
        catch (err) { $("#ownErr").textContent = err.message; b.disabled = false; b.textContent = "Sign in with Plex"; }
      });
      $("#ownJf", r)?.addEventListener("submit", async e => {
        e.preventDefault();
        const f = new FormData(e.target), b = e.target.querySelector("button"); b.disabled = true; $("#ownErr").textContent = "";
        try { await api("/setup/owner/jellyfin", {body: {username: f.get("username"), password: f.get("password") || "", device: device()}, quiet: true}); await done(); }
        catch (err) { $("#ownErr").textContent = err.message; b.disabled = false; }
      });
    },
    next: async () => { if (!SETUP.owners.length) throw new Error(`Sign in with your own account first, so ${APP()} has an admin.`); },
  },

  downloads: {
    html: () => {
      const c = SETUP.cfg, form = (k, title, port, help) => `<h2>${title}</h2>
        <form class="form" data-kind="${k}">
          <label><span>Address</span><input name="url" value="${esc(c[k].url)}" placeholder="${ex(port)}" autocapitalize="none" autocorrect="off" inputmode="url"></label>
          <label><span>API key</span><input name="key" type="password" placeholder="${saved(c[k], "key", "Paste key")}" autocomplete="off"></label>
        </form>
        <p class="foot" data-out="${k}">${help}</p>
        <button class="btn small gray" data-test="${k}">Check connection</button>`;
      const has4k = c.radarr4k.url || c.sonarr4k.url;
      return `<h1>Downloads</h1>
      <p class="lead">Approved requests go to Radarr (movies) and Sonarr (TV). Connect at least one.</p>
      ${form("radarr", "Movies · Radarr", 7878, "API key: Radarr → Settings → General.")}
      ${form("sonarr", "TV · Sonarr", 8989, "API key: Sonarr → Settings → General.")}
      <h2>4K</h2>
      <form class="form"><label><span style="width:auto">I have separate 4K servers</span>${swi("use4k", has4k)}</label></form>
      <p class="foot">Optional. Lets people ask for a 4K copy, which goes to its own Radarr/Sonarr.</p>
      <div id="k4" ${has4k ? "" : "hidden"}>
        ${form("radarr4k", "Movies in 4K · Radarr", 7879, "A second Radarr that only grabs 4K.")}
        ${form("sonarr4k", "TV in 4K · Sonarr", 8990, "A second Sonarr that only grabs 4K.")}</div>`;
    },
    init: r => {
      wireTests(r);
      $("[name=use4k]", r).onchange = e => { $("#k4").hidden = !e.target.checked; };
      for (const k of ["radarr", "sonarr", "radarr4k", "sonarr4k"]) if (SETUP.cfg[k].key_set) stest(k, r);
    },
    next: async r => {
      const body = {};
      for (const k of ["radarr4k", "sonarr4k"]) {  // optional; switching 4K off disconnects them
        const f = $(`form[data-kind=${k}]`, r), filled = $("#k4", r).hidden ? "" : $("[name=url]", f).value.trim();
        if (filled && !SETUP.ok[k] && !(await stest(k, r))?.ok) throw new Error(`${NAMES[k]} isn't connecting. Fix it or clear its address.`);
        body[k] = filled && SETUP.ok[k] ? formObj(f) : (SETUP.cfg[k].url ? {url: ""} : undefined);
      }
      for (const k of ["radarr", "sonarr"]) {
        const f = $(`form[data-kind=${k}]`, r), filled = $("[name=url]", f).value.trim();
        if (filled && !SETUP.ok[k] && !(await stest(k, r))?.ok) throw new Error(`${NAMES[k]} isn't connecting. Fix it or clear its address.`);
        if (filled && SETUP.ok[k]) body[k] = formObj(f);
      }
      if (!body.radarr && !body.sonarr) throw new Error("Connect Radarr or Sonarr, so requests have somewhere to go.");
      await saveSetup(body);
    },
  },

  extras: {

      const c = SETUP.cfg;
      return `<h1>Extras</h1>
      <p class="lead">Streaming catalogs, automatic approval and request limits. All optional.</p>

  notify: {

        `<label><span style="width:auto">${l}</span>${swi(k, n.events[k])}</label>`).join("")}</form>
      <p class="foot">"Everything new" covers whatever Radarr and Sonarr add, requested or not, checked every couple of minutes.</p>
      <h2>Personal notes</h2>
      <form class="form" id="notifyFlags">
        <label><span style="width:auto">Discord DMs</span>${swi("dm", n.dm)}</label>
        <label><span style="width:auto">Phone notifications</span>${swi("push", n.push)}</label>
      </form>
      <p class="foot">The person involved gets their own note (approved, declined, ready, fixed) whatever you post to the channel.

        Phone notifications are turned on by each person under You. On iPhone, ${APP()} has to be added to the Home Screen and opened from a secure (https) address.</p>`;

    init: r => {

      $("#addHook", r).onclick = () => { if ($$(".hook", r).length < 10) $("#hooks", r).insertAdjacentHTML("beforeend", hookRow({})); };
