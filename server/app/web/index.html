      <p class="foot">Optional. Lets people ask for a 4K copy, which goes to its own Radarr/Sonarr.</p>
      <div id="k4" ${has4k ? "" : "hidden"}>
        ${form("radarr4k", "Movies in 4K · Radarr", 7879, "A second Radarr that only grabs 4K.")}
        ${form("sonarr4k", "TV in 4K · Sonarr", 8990, "A second Sonarr that only grabs 4K.")}</div>`;
    },
    init: r => {
      wireTests(r);
      $("[name=use4k]", r).onchange = e => { $("#k4").hidden = !e.target.checked; };
      for (const k of ["radarr", "sonarr", "radarr4k", "sonarr4k"]) if (SETUP.cfg[k].key_set) stest(k, r);
    },
    next: async r => {
      const body = {};
      for (const k of ["radarr4k", "sonarr4k"]) {  // optional; switching 4K off disconnects them
        const f = $(`form[data-kind=${k}]`, r), filled = $("#k4", r).hidden ? "" : $("[name=url]", f).value.trim();
        if (filled && !SETUP.ok[k] && !(await stest(k, r))?.ok) throw new Error(`${NAMES[k]} isn't connecting. Fix it or clear its address.`);
        body[k] = filled && SETUP.ok[k] ? formObj(f) : (SETUP.cfg[k].url ? {url: ""} : undefined);
      }
      for (const k of ["radarr", "sonarr"]) {
        const f = $(`form[data-kind=${k}]`, r), filled = $("[name=url]", f).value.trim();
        if (filled && !SETUP.ok[k] && !(await stest(k, r))?.ok) throw new Error(`${NAMES[k]} isn't connecting. Fix it or clear its address.`);
        if (filled && SETUP.ok[k]) body[k] = formObj(f);
      }
      if (!body.radarr && !body.sonarr) throw new Error("Connect Radarr or Sonarr, so requests have somewhere to go.");
      await saveSetup(body);
    },
  },

  extras: {
    html: () => {
      const c = SETUP.cfg;
      return `<h1>Extras</h1>
      <p class="lead">Streaming catalogs, automatic approval and request limits. All optional.</p>
      <h2>Streaming catalogs · TMDB</h2>
      <form class="form" data-kind="tmdb">
        <label><span>Region</span>${sel("region", [["US", "United States"], ["CA", "Canada"], ["GB", "United Kingdom"], ["AU", "Australia"], ["MX", "Mexico"], ["ES", "Spain"], ["DE", "Germany"], ["FR", "France"], ["BR", "Brazil"]], c.tmdb.region)}</label>
        <label><span>API key</span><input name="key" type="password" placeholder="${saved(c.tmdb, "key", "Paste key or read token")}" autocomplete="off"></label>
      </form>
      <p class="foot" data-out="tmdb">Free at themoviedb.org → Settings → API. Powers Browse: Netflix, Max, Peacock and the rest, with their categories.</p>
      <button class="btn small gray" data-test="tmdb">Check key</button>
      <h2>Requests</h2>
      <form class="form" id="setupFlags"><label><span style="width:auto">Approve everyone automatically</span>${swi("auto_approve", c.auto_approve)}</label>
        <label><span style="width:auto">Request the next season when someone finishes one</span>${swi("auto_next", c.auto_next)}</label></form>
      <p class="foot">Your own requests are always approved. When this is off, everyone else's wait for you.</p>
      <h2>Request limits</h2>
      <form class="form" id="quotaForm">
        <label><span>Movies</span><input name="movie_limit" type="number" min="0" inputmode="numeric" value="${c.quotas.movie_limit}"></label>
        <label><span>…every (days)</span><input name="movie_days" type="number" min="1" inputmode="numeric" value="${c.quotas.movie_days}"></label>
        <label><span>TV</span><input name="tv_limit" type="number" min="0" inputmode="numeric" value="${c.quotas.tv_limit}"></label>
        <label><span>…every (days)</span><input name="tv_days" type="number" min="1" inputmode="numeric" value="${c.quotas.tv_days}"></label>
      </form>
      <p class="foot">How many requests each person can make. 0 = no limit. Admins never have limits, and you can change it per person under People.</p>
      <h2>Swipe &amp; Movie match</h2>
      <form class="form" id="funFlags"><label><span style="width:auto">Swipe (trailers, right to request)</span>${swi("swipe_on", c.swipe_on)}</label>
        <label><span style="width:auto">Movie match links</span>${swi("match_on", c.match_on)}</label></form>
      <p class="foot">Movie match always deals from your library, whoever starts it. Turn either one off for a single person under People.</p>`;
    },
    init: r => { wireTests(r); if (SETUP.cfg.tmdb.key_set) stest("tmdb", r); },
    next: async r => {
      const f = $("form[data-kind=tmdb]", r), key = $("[name=key]", f).value.trim();
      if (key && !SETUP.ok.tmdb && !(await stest("tmdb", r))?.ok) throw new Error("That TMDB key didn't work. Fix it or leave it blank.");
      const quotas = {};
      $$("#quotaForm input", r).forEach(i => quotas[i.name] = +i.value || 0);
      await saveSetup({tmdb: formObj(f), auto_approve: $("[name=auto_approve]", r).checked, auto_next: $("[name=auto_next]", r).checked, quotas,
                       swipe_on: $("[name=swipe_on]", r).checked, match_on: $("[name=match_on]", r).checked});
    },
  },

  notify: {
    html: () => {
      const c = SETUP.cfg, n = c.notify;
      return `<h1>Notifications</h1>
      <p class="lead">Tell people when their requests are approved and ready to watch, and tell you when someone asks for something or reports a problem.</p>
      <h2>Channels</h2>
      <div id="hooks">${(n.webhooks.length ? n.webhooks : [{}]).map(hookRow).join("")}</div>
      <button class="btn small gray" id="addHook">+ Add another channel</button>
      <p class="foot">A webhook link per channel: Discord (channel settings → Integrations → Webhooks → New Webhook → Copy Webhook URL),
        Fluxer (channel settings → Webhooks), or anything else that takes Discord-style webhooks. Every channel gets the same posts: the poster, backdrop,
        synopsis, who asked and who approved, seasons, 4K, year, genres and rating.</p>
      <form class="form" data-kind="site"><label><span>${APP()} address</span><input name="site_url" value="${esc(c.site_url || n.link || "")}" placeholder="${esc(location.origin)}" autocapitalize="none" autocorrect="off" inputmode="url"></label></form>
      <p class="foot">With ${APP()}'s address, each post's title links straight to it.</p>
      <h2>Post to the channels</h2>
      <form class="form" id="eventFlags">${[["pending", "New requests"], ["approved", "Approved requests"], ["denied", "Declined requests"],
        ["available", "Requests ready to watch"], ["added", "Everything new in the library"], ["issue", "Problem reports"],
        ["resolved", "Problems fixed"], ["failed", "Requests that couldn't be sent"]].map(([k, l]) =>
        `<label><span style="width:auto">${l}</span>${swi(k, n.events[k])}</label>`).join("")}</form>
      <p class="foot">"Everything new" covers whatever Radarr and Sonarr add, requested or not, checked every couple of minutes.</p>
      <h2>Personal notes</h2>
      <form class="form" id="notifyFlags">
        <label><span style="width:auto">Discord DMs</span>${swi("dm", n.dm)}</label>
        <label><span style="width:auto">Phone notifications</span>${swi("push", n.push)}</label>
      </form>
      <p class="foot">The person involved gets their own note (approved, declined, ready, fixed) whatever you post to the channel.
        DMs go to anyone with a Discord account linked${c.discord.bot_token_set ? "" : " (this needs the bot token from the sign-in step, which isn't set)"}.
        Phone notifications are turned on by each person under You. On iPhone, ${APP()} has to be added to the Home Screen and opened from a secure (https) address.</p>`;
    },
    init: r => {
      wireTests(r);
      $("#addHook", r).onclick = () => { if ($$(".hook", r).length < 10) $("#hooks", r).insertAdjacentHTML("beforeend", hookRow({})); };
      $("#hooks", r).addEventListener("click", async e => {
        const row = e.target.closest(".hook"); if (!row) return;
        if (e.target.closest("[data-rm]")) { row.remove(); return; }
        if (!e.target.closest("[data-try]")) return;
        const out = $(".foot", row), url = $("[name=url]", row).value.trim();
        if (!url && !row.dataset.id) { out.textContent = "Paste the webhook link first."; return; }
        out.className = "foot"; out.textContent = "Sending…";
        try {
          const x = await api("/setup/test", {body: {kind: "notify", webhook: url, hook_id: url ? null : row.dataset.id}, quiet: true});
          out.textContent = (x.ok ? "✓ " : "✕ ") + x.message; out.classList.add(x.ok ? "ok" : "bad"); row.dataset.ok = x.ok ? url || "saved" : "";
        } catch (err) { out.textContent = "✕ " + err.message; out.classList.add("bad"); }
      });
    },
    next: async r => {
      const hooks = [];
      for (const row of $$(".hook", r)) {
        const url = $("[name=url]", row).value.trim(), name = $("[name=name]", row).value.trim();
        if (!url && !row.dataset.id) continue;  // an empty new row
        if (url && row.dataset.ok !== url) {  // a new link: make sure it works before saving it
          const x = await api("/setup/test", {body: {kind: "notify", webhook: url}, quiet: true});
          if (!x.ok) throw new Error(`The ${name || "new"} webhook didn't work: ${x.message}`);
        }
        hooks.push({id: row.dataset.id || null, name, url});
      }
      const events = {};
      $$("#eventFlags input", r).forEach(i => events[i.name] = i.checked);
      await saveSetup({site_url: $("[name=site_url]", r).value.trim(), notify: {webhooks: hooks, dm: $("[name=dm]", r).checked, push: $("[name=push]", r).checked, events}});
    },
  },

  done: {
    html: () => {
      const c = SETUP.cfg, on = [c.jellyfin_login && c.jellyfin.url && "Jellyfin", c.plex_login && c.plex.url && "Plex", c.discord_login && c.discord.client_id && "Discord", c.fluxer_login && c.fluxer.client_id && "Fluxer"].filter(Boolean);
      const row = (k, v) => `<div><span>${k}</span><b>${v}</b></div>`;
      return `<h1>You're all set</h1>
      <p class="lead">Here's what ${APP()} will use. Everything can be changed later in You → Settings.</p>
      <div class="summary">
        ${row("Sign in with", on.join(" · ") || "—")}
        ${row("Admin", SETUP.owners.map(o => esc(o.name)).join(", "))}
        ${row("Movies", c.radarr.key_set ? "Radarr ✓" : "Not connected")}
        ${row("TV", c.sonarr.key_set ? "Sonarr ✓" : "Not connected")}
        ${row("4K", c.radarr4k.key_set || c.sonarr4k.key_set ? [c.radarr4k.key_set && "Radarr 4K", c.sonarr4k.key_set && "Sonarr 4K"].filter(Boolean).join(" · ") + " ✓" : "Off")}
        ${row("Streaming catalogs", c.tmdb.key_set ? "On ✓" : "Off")}
        ${row("New requests", c.auto_approve ? "Approved automatically" : "Wait for you")}
        ${row("Limits", [c.quotas.movie_limit && `${c.quotas.movie_limit} movies / ${c.quotas.movie_days}d`, c.quotas.tv_limit && `${c.quotas.tv_limit} TV / ${c.quotas.tv_days}d`].filter(Boolean).join(" · ") || "None")}
        ${row("Notifications", [c.notify.webhooks.length && (c.notify.webhooks.length === 1 ? "1 channel" : c.notify.webhooks.length + " channels"), c.notify.dm && c.discord.bot_token_set && "DMs", c.notify.push && "Phones"].filter(Boolean).join(" · ") || "Off")}
      </div>`;
    },
    next: async () => {},
  },
};
const setupOrder = () => (SETUP.admin ? [] : ["welcome"]).concat(["signin", "owner", "downloads", "extras", "notify", "done"]);

function renderSetup() {
  const order = setupOrder(), name = order[SETUP.step];
  $("#setup").innerHTML = `<div class="wrap">
    <div class="dots">${order.map((_, i) => `<i class="${i === SETUP.step ? "on" : ""}"></i>`).join("")}</div>
    <div class="step">${STEPS[name].html()}</div>
    <p class="err" id="setupErr"></p>
    <div class="setup-nav">${SETUP.step > 0 || SETUP.admin ? `<button class="btn gray" id="setupBack">${SETUP.step > 0 ? "Back" : "Cancel"}</button>` : ""}
      <button class="btn" id="setupNext">${name === "done" ? (SETUP.admin ? "Done" : "Open " + APP()) : "Continue"}</button></div></div>`;
  STEPS[name].init?.($("#setup .step"));
  $("#setupNext").onclick = setupNext;
  $("#setupBack")?.addEventListener("click", () => { if (SETUP.step > 0) { SETUP.step--; renderSetup(); } else location.reload(); });
  scrollTo(0, 0);
}
async function setupNext() {
  const btn = $("#setupNext"), name = setupOrder()[SETUP.step];
  btn.disabled = true; $("#setupErr").textContent = "";
  try {
    await STEPS[name].next($("#setup .step"));
    if (name === "done") { await api("/setup/finish", {body: {}, quiet: true}); SETUP.code = ""; location.replace("/"); return; }
    SETUP.step++; renderSetup();
  } catch (e) { $("#setupErr").textContent = e.message; btn.disabled = false; }
}
async function showSetup(admin) {
  $("#app").hidden = $("#tabs").hidden = $("#login").hidden = true; hideSheet();
  if (CUR.item || CUR.person) { CUR = {...CUR, item: null, person: null}; history.replaceState(CUR, ""); }
  Object.assign(SETUP, {admin, step: 0, ok: {}, use: null});
  if (admin) { try { await loadSetupCfg(); } catch (e) { toast(e.message); return start(); } }
  $("#setup").hidden = false;
  renderSetup();
}

async function start() {
  applyBrand();
  api("/auth/options", {quiet: true}).then(o => applyBrand(o.name)).catch(() => {});
  const mcode = new URLSearchParams(location.search).get("match");
  if (mcode && /^[\w-]{6,20}$/.test(mcode)) {  // a movie match link: no sign-in needed
    ME = await api("/me", {quiet: true}).catch(() => null);
    if (ME?.prefs?.theme && ME.prefs.theme !== theme()) setTheme(ME.prefs.theme, false);
    $("#login").hidden = true;
    return openMatch(mcode, false);
  }
  try { ME = await api("/me", {quiet: true}); } catch { return showLogin(); }
  if ((await api("/setup/status", {quiet: true}).catch(() => ({}))).needed) return showSetup(false);
  const tvq = new URLSearchParams(location.search);
  if (tvq.has("tv")) {  // signing in the Apple TV app: it shows a code (and a QR code that lands here)
    history.replaceState(null, "", "/");
    const code = (tvq.get("tv") || prompt("Type the code shown on the TV") || "").trim();
    if (code && confirm(`Sign in the TV (code ${code.toUpperCase()}) as ${ME.name}?`))
      api("/auth/tv/approve", {body: {code}}).then(() => toast("The TV is signed in.")).catch(e => toast(e.message));
  }
  if (ME.prefs?.theme && ME.prefs.theme !== theme()) setTheme(ME.prefs.theme, false);
  $("#login").hidden = $("#setup").hidden = true; $("#app").hidden = $("#tabs").hidden = false;
  let s = history.state?.tab ? history.state : {tab: "home", depth: 0};  // a reload stays on the same screen
  const link = new URLSearchParams(location.search).get("item")?.match(/^(movie|tv):(\d+)$/);  // from a Discord post or notification
  if (link) { s = {tab: "home", depth: 0, item: {type: link[1], id: +link[2]}}; history.replaceState(null, "", "/"); }
  history.replaceState(s, ""); CUR = {tab: null, depth: 0}; apply(s, true);
  refreshBadge(); setInterval(refreshBadge, 60000);
}
start();
</script>
</body>
</html>
