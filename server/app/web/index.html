.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:50;
  background:rgba(30,30,32,.94);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:500;
  opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spin{width:22px;height:22px;border:2.5px solid var(--fill2);border-top-color:var(--text2);border-radius:50%;animation:sp 0.8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.me{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:18px}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);
  display:grid;place-items:center;font-weight:700;font-size:18px}
</style>
</head>
<body>

<section id="setup" class="setup" hidden></section>
<section id="swipe" class="swipe" hidden></section>
<section id="office" class="office" hidden aria-label="The Office, live"></section>
<section id="wrapped" class="wrapped" hidden></section>
<section id="match" class="match" hidden></section>

<section id="login" class="login" hidden>
  <div class="box">
    <p class="logo">Nuni<span>Flix</span></p>
    <p class="muted" style="margin:0 0 22px">Find something. Ask for it. Watch it.</p>
    <div style="display:grid;gap:10px">
      <button id="plexBtn" class="btn plex wide" hidden>Continue with Plex</button>
      <button id="discordBtn" class="btn discord wide" hidden>Continue with Discord</button>
      <button id="fluxerBtn" class="btn fluxer wide" hidden>Continue with Fluxer</button>
    </div>
    <div id="orLine" class="or" hidden>or use your Jellyfin account</div>
    <form id="jfForm" hidden>
      <input class="input" name="username" placeholder="Jellyfin username" autocomplete="username" autocapitalize="none" required>
      <input class="input" name="password" type="password" placeholder="Password" autocomplete="current-password">
      <button class="btn wide" type="submit">Sign In</button>
    </form>
    <p id="loginErr" class="err"></p>
  </div>
</section>

<main id="app" hidden>
  <section class="screen" data-tab="home">
    <h1 class="big-title">Nuni<span class="dot">Flix</span></h1>
    <p class="dateline" id="dateline"></p>
    <div id="homeBody"><div class="spin"></div></div>
  </section>

  <section class="screen" data-tab="browse" hidden>
    <div id="browseHome">
      <h1 class="big-title">Browse</h1>
      <div id="browseBody"><div class="spin"></div></div>
    </div>
    <div id="provView" hidden>
      <button class="back" id="provBack">‹ Browse</button>
      <div class="prov-head"><img id="provLogo" alt=""><h1 class="big-title" id="provName" style="margin:0"></h1></div>
      <label class="field" style="margin-bottom:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="provQ" type="search" autocomplete="off" enterkeyhint="search"></label>
      <div id="provFound" hidden></div>
      <div class="seg" id="provKind"><button data-k="tv" class="on">TV Shows</button><button data-k="movie">Movies</button></div>
      <div id="provRows" style="margin-top:16px"></div>
      <div id="provAll" hidden>
        <h2 id="allTitle" style="margin-top:18px"></h2>
        <div class="chips" id="provSort"><button data-s="popular" class="on">Popular</button><button data-s="new">Newest</button><button data-s="top">Top rated</button></div>
        <div id="provGrid" class="grid"></div>
        <div id="provMore"></div>
      </div>
    </div>
  </section>

  <section class="screen" data-tab="search" hidden>
    <h1 class="big-title">Search</h1>
    <div class="searchbox">
      <label class="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Movies and shows" autocomplete="off" enterkeyhint="search"></label>
      <div class="seg" id="kindSeg"><button data-k="" class="on">All</button><button data-k="movie">Movies</button><button data-k="tv">TV Shows</button></div>
    </div>
    <div id="results" style="margin-top:8px"><p class="empty">Search for anything. If you don't have it, request it.</p></div>
  </section>

  <section class="screen" data-tab="requests" hidden>
    <h1 class="big-title">Requests</h1>
    <div class="seg" id="reqSeg"></div>
    <div id="reqBody" style="margin-top:14px"><div class="spin"></div></div>
  </section>

  <section class="screen" data-tab="you" hidden>
    <h1 class="big-title">You</h1>
    <div id="youBody"></div>
  </section>
</main>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 2.7 11a1 1 0 0 0 1.3 1.5l.9-.8V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-8.3l.9.8a1 1 0 1 0 1.3-1.5Z"/></svg>Home</button>
  <button data-tab="browse"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2.2"/><rect x="13" y="3" width="8" height="8" rx="2.2"/><rect x="3" y="13" width="8" height="8" rx="2.2"/><rect x="13" y="13" width="8" height="8" rx="2.2"/></svg>Browse</button>
  <button data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>Search</button>
  <button data-tab="requests"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a2 2 0 0 1 2 2v16l-8-4-8 4V5a2 2 0 0 1 2-2Z"/></svg>Requests<span class="badge" id="pendBadge" hidden></span></button>
  <button data-tab="you"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 20.5c.8-4 4.2-6.5 8.5-6.5s7.7 2.5 8.5 6.5a1 1 0 0 1-1 1.2h-15a1 1 0 0 1-1-1.2Z"/></svg>You</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// for style="background-image:url('…')": quotes and brackets can't end the url() even after the browser decodes the attribute
const bg = u => esc(String(u ?? "").replace(/['"()\\\s]/g, c => "%" + c.charCodeAt(0).toString(16).padStart(2, "0")));
let ME = null;
// The app's name: "<brand>Flix". The owner sets the first half (System tab); a friend's copy can be MaxFlix.
let BRAND = (() => { try { return localStorage.getItem("nf.brand") || "Nuni"; } catch { return "Nuni"; } })();
const APP = () => BRAND + "Flix";
function applyBrand(b) {
  if (b && b !== BRAND) { BRAND = b; try { localStorage.setItem("nf.brand", b); } catch {} }
  document.title = APP();
  $('meta[name="apple-mobile-web-app-title"]').content = APP();
  $$(".logo").forEach(el => el.innerHTML = `${esc(BRAND)}<span>Flix</span>`);
  $$('[data-tab="home"] > .big-title').forEach(el => el.innerHTML = `${esc(BRAND)}<span class="dot">Flix</span>`);
}
const SRC = {plex: "Plex", jellyfin: "Jellyfin", discord: "Discord", fluxer: "Fluxer"};

async function api(path, opts = {}) {
  const r = await fetch("/api" + path, {
    method: opts.method || (opts.body ? "POST" : "GET"),
    headers: {"X-NF": "1", ...(opts.body ? {"Content-Type": "application/json"} : {}), ...(SETUP.code ? {"X-Setup-Code": SETUP.code} : {}), ...(opts.headers || {})},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    credentials: "same-origin",
  });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && !opts.quiet) { showLogin(); throw new Error("Sign in first."); }
  if (!r.ok && r.status !== 202) throw new Error(typeof data.detail === "string" ? data.detail : "Something went wrong.");
  return Object.assign(data, {_status: r.status});
}

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2600);
}

/* ---------- lazy images ----------
   Any <img data-src> that shows up is loaded once it's near the screen, plus the next few in its row,
   so swiping sideways never reveals blank posters. */
const lazyIO = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    let el = e.target.closest(".tile, .svc, .li") || e.target;
    for (let i = 0; el && i < 5; i++, el = el.nextElementSibling) {
      const img = el.matches("img[data-src]") ? el : el.querySelector("img[data-src]");
      if (img) { img.src = img.dataset.src; img.removeAttribute("data-src"); lazyIO.unobserve(img); }
    }
  }
}, {rootMargin: "400px 200px"});
new MutationObserver(() => document.querySelectorAll("img[data-src]:not([data-watch])").forEach(img => {
  img.dataset.watch = "1"; lazyIO.observe(img);
})).observe(document.body, {childList: true, subtree: true});

/* ---------- themes ---------- */
const THEMES = {nuniflix: "NuniFlix", repertory: "Repertory", premiere: "Premiere", nunitech: "Nunitech", blockbuster: "Blockbuster", retro: "Retro", atomic: "Atomic Age", horror: "Horror"};
const theme = () => document.documentElement.dataset.theme || "nuniflix";
const WORDS = {
  base: {available: "Available", partial: "Some", requested: "Requested", pending: "Pending", request: "Request",
         inLibrary: "✓ In your library", okToast: "Requested. It's on its way.", pendToast: "Requested. An admin will approve it."},
  blockbuster: {request: "Reserve",
         okToast: "Reserved! Be kind, rewind.", pendToast: "Reserved! A manager will approve it."},
  horror: {request: "Summon",
         okToast: "Summoned. We have such sights to show you.", pendToast: "Offered up. The owner will decide your fate."},
  atomic: {request: "Launch",
         okToast: "Blast off! It's on its way.", pendToast: "Countdown started. An admin will approve it."},
  repertory: {request: "Request",
         okToast: "Requested. It's on its way.", pendToast: "Requested. It's in the review pile."},
  premiere: {request: "Request",
         okToast: "Requested. It's on its way.", pendToast: "Requested. Waiting for approval."},
  retro: {request: "Book it",
         okToast: "Booked! Stay tuned.", pendToast: "Booked! Waiting on the producer."},
};
const W = k => (WORDS[theme()] || {})[k] || WORDS.base[k];
function setTheme(t, save = true) {
  if (t === "nuniflix") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  try { localStorage.setItem("nf.theme", t); } catch {}
  if (save && ME) api("/me/prefs", {body: {theme: t}}).catch(() => {});  // follows you to other devices (and their sign-in page)
  $('meta[name="theme-color"]').content = getComputedStyle(document.body).backgroundColor || "#000";
  $("#provRows").dataset.key = "";  // re-draw cached rows so sticker words match
  if (CUR.tab && CUR.tab !== "you") { const s = CUR; CUR = {tab: null, depth: s.depth}; apply(s, true); }
  if ($("#provQ").value.trim().length >= 2) provSearch();
}

/* ---------- labels ---------- */
function statusLabel(it) {
  switch (it.status) {
    case "available": return [W("available"), "available"];
    case "partial": return [W("partial"), "partial"];
    case "processing": return [it.progress != null ? `${it.progress}%` : W("requested"), "processing"];
    case "pending": return [W("pending"), "pending"];
  }
  return null;
}
function reqTag(r) {
  if (r.status === "pending") return `<span class="tag orange">Waiting for approval</span>`;
  if (r.status === "denied") return `<span class="tag red">Declined${r.note ? " · " + esc(r.note) : ""}</span>`;
  if (r.status === "failed") return `<span class="tag red">Couldn't send${r.note ? " · " + esc(r.note) : ""}</span>`;
  if (r.media_status === "available") return `<span class="tag green">Available</span>`;
  if (r.media_status === "partial") return `<span class="tag green">Partly available</span>`;
  if (r.progress != null) return `<span class="tag ${/stuck/.test(r.why || "") ? "orange" : "blue"}">Downloading ${r.progress}%${r.why ? " · " + esc(r.why) : ""}</span>`;
  return `<span class="tag blue">${r.why ? esc(r.why) : "Approved · searching"}</span>`;
}
const ago = t => { const s = Date.now() / 1000 - t; return s < 3600 ? `${Math.max(1, s / 60 | 0)}m ago` : s < 86400 ? `${s / 3600 | 0}h ago` : `${s / 86400 | 0}d ago`; };

const WHO = `<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="3" fill="currentColor"/><path d="M2 15c.6-3.3 3-5 6-5s5.4 1.7 6 5z" fill="currentColor"/></svg>`;
function tile(it) {
  const lab = statusLabel(it);
  const [dt, di] = it.type === "tv" && !it.id ? ["tvtmdb", it.tmdb] : [it.type, it.id];
  return `<button class="tile" data-type="${dt}" data-id="${di}">
    <div class="poster">${it.poster ? `<img data-src="${esc(it.poster)}" alt="">` : `<div class="ph">${esc(it.title)}</div>`}
      ${it.type === "tv" ? `<span class="kind">TV</span>` : ""}
      ${lab ? `<span class="pill ${lab[1]}">${lab[0]}</span>` : ""}
      ${it.requested_by ? `<span class="who">${WHO}${esc(it.requested_by)}</span>` : ""}
      ${it.progress != null && it.status !== "available" ? `<span class="bar"><i style="width:${it.progress}%"></i></span>` : ""}
    </div>
    <div class="t">${esc(it.title)}</div><div class="s">${it.year || ""}${it.network ? " · " + esc(it.network) : ""}</div>
  </button>`;
}
function reqRow(r, admin) {
  const by = admin && r.requested_by?.id !== ME.id ? ` · ${esc(r.requested_by.name)}` : "";
  const seasons = r.episodes ? ` · S${r.seasons[0]} ${r.episodes.length > 4 ? `· ${r.episodes.length} episodes` : "E" + r.episodes.join(", E")}`
    : r.seasons ? ` · S${r.seasons.join(", S")}` : "";
  return `<div class="li" data-rid="${r.id}" data-kind="${r.type}" data-k4="${r.is4k ? 1 : 0}">
    <button class="thumb" data-type="${r.type}" data-id="${r.media_id}">${r.poster ? `<img data-src="${esc(r.poster)}" alt="">` : ""}</button>
    <div class="body"><div class="t">${esc(r.title)}</div>
      <div class="s">${r.type === "tv" ? "TV" : "Movie"}${r.is4k ? " · 4K" : ""}${r.year ? " · " + r.year : ""}${seasons}${by} · ${ago(r.created)}</div>${reqTag(r)}</div>
    <div class="acts">
      ${admin && r.status === "pending" ? `<button class="btn small gray" data-act="opts" aria-label="Quality and folder">⚙︎</button><button class="btn small green" data-act="approve">Approve</button><button class="btn small red" data-act="deny">Decline</button>` : ""}
      ${admin && r.status === "failed" ? `<button class="btn small gray" data-act="approve">Retry</button>` : ""}
      ${!admin && r.status === "pending" ? `<button class="btn small gray" data-act="cancel">Cancel</button>` : ""}
    </div></div>`;
}

/* ---------- navigation ----------
   Every screen is a state {tab, prov, kind, view, cat, sort, title, item}. Going forward pushes a history entry,
   so Back (the in-app button, the browser's, or the iPhone swipe) always returns to the screen you came from. */
let CUR = {tab: null, depth: 0};
const LAST = {};  // where each tab was left, so switching tabs comes back to the same spot

function nav(next, replace = false) {
  history.replaceState({...CUR, y: scrollY}, "");  // remember how far down this screen was
  const s = {...next, depth: (CUR.depth || 0) + (replace ? 0 : 1)};
  if (replace) history.replaceState(s, ""); else history.pushState(s, "");
  apply(s, false);
}
function back() {
  if (CUR.depth > 0) return history.back();
  // opened straight onto this screen (fresh load): step up to its parent instead
  if (CUR.item || CUR.person) return nav({...CUR, item: null, person: null}, true);
  if (CUR.swipe || CUR.wrapped || CUR.match || CUR.office) return nav({...CUR, swipe: false, wrapped: false, match: null, office: false}, true);
  if (CUR.tab === "home" && CUR.view) return nav({tab: "home"}, true);
  if (CUR.view === "all") return nav({...CUR, view: "rows"}, true);
  if (CUR.prov) return nav({tab: "browse"}, true);
}
window.addEventListener("popstate", e => { if (ME) apply(e.state?.tab ? e.state : {tab: "home", depth: 0}, true); });

const screenKey = s => [s.tab, s.prov?.id, s.kind, s.view, s.cat, s.sort].join("|");
async function apply(s, popped) {
  const prev = CUR; CUR = s;
  const {item, person, swipe, wrapped, match, office, y, ...screen} = s; LAST[s.tab] = screen;
  if (screenKey(prev) !== screenKey(s)) {
    $$("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === s.tab));
    $$("main .screen").forEach(el => el.hidden = el.dataset.tab !== s.tab);
    if (!popped) window.scrollTo(0, 0);
    if (s.tab === "browse") await showBrowse(s);
    else if (s.tab === "search") { if (!popped && !s.item) setTimeout(() => $("#q").focus(), 50); }
    else await ({home: loadHome, requests: loadRequests, you: loadYou})[s.tab]();
    if (popped && CUR === s) window.scrollTo(0, s.y || 0);
  }
  if (CUR !== s) return;  // navigated again while this screen was loading
  if (s.swipe) openSwipe(); else closeSwipe();
  if (s.office) openOffice(); else closeOffice();
  if (s.wrapped) openWrapped(); else closeWrapped();
  if (s.match) openMatch(s.match); else if (MT.inApp) closeMatch();
  const open = $("#sheet").classList.contains("on");
  if (s.item) {
    if (!open || !prev.item || prev.item.type !== s.item.type || prev.item.id !== s.item.id) openItem(s.item.type, s.item.id);
  } else if (s.person) {
    if (!open || prev.person !== s.person) openPerson(s.person);
  } else hideSheet();
}

$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const t = b.dataset.tab;
  if (t === CUR.tab && !CUR.prov && !CUR.item) return window.scrollTo({top: 0, behavior: "smooth"});
  nav(t === CUR.tab ? {tab: t} : (LAST[t] || {tab: t}));  // tapping the tab you're on goes back to its top
});
document.addEventListener("click", e => { const g = e.target.closest("[data-goto]"); if (g) nav({tab: g.dataset.goto}); });

/* ---------- browse (streaming services, via TMDB) ---------- */
let BROWSE = null, ROWS = {};
let PROV = {id: null, kind: "tv", view: "rows", cat: null, sort: "popular", page: 0, total: 1, loading: false, seq: 0, grid: null};
async function loadBrowse() {
  if (BROWSE) return renderBrowse();
  try { BROWSE = await api("/browse/providers"); renderBrowse(); }
  catch (e) { $("#browseBody").innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
}
function renderBrowse() {
  const b = BROWSE;
  if (!b.enabled) {
    $("#browseBody").innerHTML = `<p class="empty">Streaming services aren't set up yet.${ME.owner ? `<br><br><button class="btn gray" data-goto="you">Add a TMDB key in Settings</button>` : ""}</p>`;
    return;
  }
  $("#browseBody").innerHTML =
    `<div class="services">${b.providers.map(p => `<button class="svc" data-prov="${p.id}">
      ${p.logo ? `<img data-src="${esc(p.logo)}" alt="">` : `<div class="ph"></div>`}<span>${esc(p.name)}</span></button>`).join("")}</div>` +
    (b.trending.length ? `<h2>Trending this week</h2><div class="row">${b.trending.map(tile).join("")}</div>` : "");
}
document.addEventListener("click", e => {
  const p = e.target.closest("[data-prov]"); if (!p) return;
  const prov = (BROWSE?.providers || []).find(x => x.id === p.dataset.prov) || {id: p.dataset.prov, name: p.dataset.name || "", logo: p.querySelector("img")?.src || ""};
  nav({tab: "browse", prov: {id: prov.id, name: prov.name, logo: prov.logo}, kind: "tv", view: "rows"});
});

async function showBrowse(s) {
  if (!s.prov) {
    PROV.id = null; $("#provView").hidden = true; $("#browseHome").hidden = false;
    return loadBrowse();
  }
  Object.assign(PROV, {id: s.prov.id, name: s.prov.name, kind: s.kind || "tv"});
  $("#provName").textContent = s.prov.name; $("#provLogo").src = s.prov.logo || ""; $("#provLogo").hidden = !s.prov.logo;
  if ($("#provQ").dataset.prov !== s.prov.id) { $("#provQ").value = ""; $("#provQ").dataset.prov = s.prov.id; provSearch(); }
  $("#provQ").placeholder = "Search " + s.prov.name;
  $$("#provKind button").forEach(x => x.classList.toggle("on", x.dataset.k === PROV.kind));
  $("#browseHome").hidden = true; $("#provView").hidden = false;
  return s.view === "all" ? showAll(s.title, s.cat, s.sort) : showRows();

/* search just this service */
let provQTimer, provQSeq = 0;
$("#provQ").addEventListener("input", () => { clearTimeout(provQTimer); provQTimer = setTimeout(provSearch, 450); });
$("#provQ").addEventListener("keydown", e => { if (e.key === "Enter") { clearTimeout(provQTimer); provSearch(); e.target.blur(); } });
async function provSearch() {
  const q = $("#provQ").value.trim(), seq = ++provQSeq, searching = q.length >= 2;
  $("#provFound").hidden = !searching;
  $("#provView").classList.toggle("searching", searching);
  if (!searching) return;
  $("#provFound").innerHTML = `<div class="spin"></div>`;
  try {
    const d = await api(`/browse/provider/${encodeURIComponent(PROV.id)}/search?q=${encodeURIComponent(q)}`);
    if (seq !== provQSeq) return;
    $("#provFound").innerHTML = d.results.length ? `<div class="grid">${d.results.map(tile).join("")}</div>`
      : `<p class="empty">Nothing matching “${esc(q)}” is on ${esc(PROV.name)}.</p>`;
  } catch (e) { if (seq === provQSeq) $("#provFound").innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
}

/* service home: featured title + category rows */
async function showRows() {
  PROV.view = "rows"; PROV.seq++;
  $("#provAll").hidden = true; $("#provRows").hidden = false; $("#provKind").hidden = false;
  const key = PROV.id + ":" + PROV.kind, seq = PROV.seq;
  if (!ROWS[key]) {
    $("#provRows").innerHTML = `<div class="spin"></div>`;
    try { ROWS[key] = await api(`/browse/provider/${encodeURIComponent(PROV.id)}/rows?type=${PROV.kind}`); }
    catch (e) { if (seq === PROV.seq) $("#provRows").innerHTML = `<p class="empty">${esc(e.message)}</p>`; return; }
    if (seq !== PROV.seq) return;
  }
  if ($("#provRows").dataset.key === key) return;  // already showing these rows
  const d = ROWS[key], h = d.hero;
  $("#provRows").dataset.key = key;
  if (!d.rows.length) { $("#provRows").innerHTML = `<p class="empty">Nothing here.</p>`; return; }
  const lab = h && statusLabel(h);
  $("#provRows").innerHTML =
    (h ? `<button class="feature" data-type="${h.type === "tv" && !h.id ? "tvtmdb" : h.type}" data-id="${h.type === "tv" && !h.id ? h.tmdb : h.id}"
        style="background-image:url('${bg(h.backdrop)}')">${lab ? `<span class="pill ${lab[1]}">${lab[0]}</span>` : ""}
        <div class="info"><div class="eyebrow">Popular on ${esc(PROV.name)}</div><div class="ft">${esc(h.title)}</div>
        <div class="fo">${esc(h.overview)}</div></div></button>` : "") +
    d.rows.map((r, i) => `<h2>${esc(r.title)} <small><button class="see" data-row="${i}">See all</button></small></h2>
      <div class="row" data-ri="${i}">${r.items.map(tile).join("")}</div>`).join("");
}
$("#provRows").addEventListener("scroll", e => {  // scroll doesn't bubble, so listen in the capture phase
  const row = e.target.closest?.(".row[data-ri]");
  if (row && row.scrollLeft + row.clientWidth > row.scrollWidth - 500) rowMore(row);
}, true);
async function rowMore(el) {
  const key = PROV.id + ":" + PROV.kind, r = ROWS[key]?.rows[+el.dataset.ri];
  if (!r || r.loading || (r.page || 1) >= (r.total || 99)) return;
  r.loading = true;
  try {
    const d = await api(`/browse/provider/${encodeURIComponent(PROV.id)}?type=${PROV.kind}&sort=${r.sort}&page=${(r.page || 1) + 1}${r.cat ? "&cat=" + r.cat : ""}&quick=1`);
    r.page = d.page; r.total = d.total_pages;
    const seen = new Set(r.items.map(x => x.type + (x.id || "t" + x.tmdb)));
    const fresh = d.results.filter(x => !seen.has(x.type + (x.id || "t" + x.tmdb)));
    r.items.push(...fresh);
    if ($("#provRows").dataset.key === key) el.insertAdjacentHTML("beforeend", fresh.map(tile).join(""));
  } catch {}
  r.loading = false;
}
$("#provRows").addEventListener("click", e => {
  const b = e.target.closest("[data-row]"); if (!b) return;
  const r = ROWS[PROV.id + ":" + PROV.kind].rows[+b.dataset.row];
  nav({...CUR, item: null, view: "all", title: r.title, cat: r.cat, sort: r.sort});
});

/* "see all": one category as an endless grid */
function showAll(title, cat, sort) {
  Object.assign(PROV, {view: "all", cat, sort});
  $("#allTitle").textContent = title || "";
  $$("#provSort button").forEach(x => x.classList.toggle("on", x.dataset.s === sort));
  $("#provRows").hidden = true; $("#provKind").hidden = true; $("#provAll").hidden = false;
  const grid = [PROV.id, PROV.kind, cat, sort].join("|");
  if (PROV.grid !== grid || !$("#provGrid").children.length) { PROV.grid = grid; provReset(); }  // else keep what's loaded
}
function provReset() { PROV.page = 0; PROV.total = 1; PROV.seq++; $("#provGrid").innerHTML = ""; provMore(); }
async function provMore() {
  if (PROV.view !== "all" || PROV.loading === PROV.seq || PROV.page >= PROV.total) return;
  const seq = PROV.seq; PROV.loading = seq;  // a reset bumps seq, so a stale load never blocks the new one
  $("#provMore").innerHTML = `<div class="spin"></div>`;
  try {
    const d = await api(`/browse/provider/${encodeURIComponent(PROV.id)}?type=${PROV.kind}&sort=${PROV.sort}&page=${PROV.page + 1}${PROV.cat ? "&cat=" + PROV.cat : ""}&quick=1`);
    if (seq !== PROV.seq) return;
    PROV.page = d.page; PROV.total = d.total_pages;
    $("#provGrid").insertAdjacentHTML("beforeend", d.results.map(tile).join(""));
    $("#provMore").innerHTML = PROV.page < PROV.total ? `<button class="btn wide gray" data-more style="margin-top:18px">Load more</button>`
      : (!$("#provGrid").children.length ? `<p class="empty">Nothing here.</p>` : `<p class="empty">That's everything.</p>`);
  } catch (e) { if (seq === PROV.seq) $("#provMore").innerHTML = `<p class="empty">${esc(e.message)}</p><button class="btn gray" data-more>Try again</button>`; return; }
  finally { if (PROV.loading === seq) PROV.loading = false; }
  // still near the bottom (short page or fast scrolling)? keep going
  if (seq === PROV.seq && $("#provMore").getBoundingClientRect().top < innerHeight + 600) provMore();
}
$("#provMore").addEventListener("click", e => { if (e.target.closest("[data-more]")) provMore(); });
window.addEventListener("scroll", () => {
  if (CUR.prov && PROV.view === "all" && $("#provMore").getBoundingClientRect().top < innerHeight + 600) provMore();
}, {passive: true});
new IntersectionObserver(es => { if (es[0].isIntersecting && CUR.prov && PROV.view === "all") provMore(); }, {rootMargin: "600px"}).observe($("#provMore"));
$("#provBack").onclick = back;
$("#provKind").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  nav({...CUR, kind: b.dataset.k, view: "rows"}, true); });
$("#provSort").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  nav({...CUR, sort: b.dataset.s}, true); });

/* ---------- home ---------- */
async function loadHome() {
  if (CUR.view === "movie" || CUR.view === "tv") {  // "See all" on a home row
    const k = CUR.view;
    $("#homeBody").innerHTML = `<button class="back" data-home-back>‹ Home</button><h2>${k === "movie" ? "Now playing" : "New episodes"}</h2><div class="spin"></div>`;
    $("[data-home-back]").onclick = back;
    try {
      const {results} = await api(`/home/recent?kind=${k}`);
      if (CUR.view !== k) return;
      $("#homeBody .spin").outerHTML = results.length ? `<div class="grid">${results.map(tile).join("")}</div>` : `<p class="empty">Nothing yet.</p>`;
    } catch (e) { $("#homeBody .spin").outerHTML = `<p class="empty">${esc(e.message)}</p>`; }
    return;
  }
  try {
    const h = await api("/home");
    const mine = h.my_requests.filter(r => r.status !== "denied").slice(0, 12);
    const layout = (ME.prefs?.home || ["featured", "requests", "office", "movies", "trending", "discover", "theaters", "popular", "upcoming", "tv", "genres"])
      .filter(k => !(ME.home_off || []).includes(k));
    $("#dateline").innerHTML = `<span>${new Date().toLocaleDateString(undefined, {weekday: "long", month: "long", day: "numeric"})}</span>`;
    const lead = h.recent_movies.find(m => m.poster)?.poster;  // Premiere: Home glows with the newest movie's color
    if (lead && INK_THEMES.includes(theme())) posterHue(lead).then(hue => {
      if (typeof hue === "number") document.documentElement.style.setProperty("--home-h", hue);
    });
    const row = (title, items, all, cls = "") => items.length ? `<h2>${title}${all ? ` <small><button class="see" data-home-all="${all}">See all</button></small>` : ""}</h2>
      <div class="row ${cls}">${items.map(tile).join("")}</div>` : "";
    const f = ME.features || {};
    const part = {
      requests: () => mine.length ? `<h2>Your requests <small><button data-goto="requests">See all</button></small></h2>
        <div class="row">${mine.map(r => tile({type: r.type, id: r.media_id, title: r.title, year: r.year, poster: r.poster,
          status: r.status === "pending" ? "pending" : r.media_status === "available" ? "available" : "processing", progress: r.progress})).join("")}</div>` : "",
      featured: () => `<div class="bbs" id="bb" hidden></div>`,
      office: () => `<button class="ofc" id="ofCard" data-open-office><span class="ofc-bld ofc-win" aria-hidden="true">${"<i></i>".repeat(9)}</span>
        <span class="ofc-txt"><b>${esc(APP())} HQ</b><span class="ofc-live">LIVE</span><div class="ofc-sum">Peek inside the building</div></span><span class="chev">›</span></button>`,
      discover: () => f.swipe || f.match ? `<div class="ctas">${f.swipe ? `<button class="cta" data-open-swipe><span class="ico">♥</span><span><b>Swipe</b><small>Trailers, one after another. Right to ${esc(W("request").toLowerCase())}.</small></span></button>` : ""}
        ${f.match ? `<button class="cta alt" data-open-match><span class="ico">⚡</span><span><b>Movie match</b><small>Send someone a link. Swipe until you both like one.</small></span></button>` : ""}</div>` : "",
      foryou: () => `<div id="forYou"></div>`,
      movies: () => row("Now playing", h.recent_movies, "movie", "bare"),
      tv: () => row("New episodes", h.recent_tv, "tv"),
      trending: () => `<div id="trendRow"></div>`,
      theaters: () => `<div class="hd" data-hd="theaters"></div>`, popular: () => `<div class="hd" data-hd="popular"></div>`,
      upcoming: () => `<div class="hd" data-hd="upcoming"></div>`, genres: () => `<div class="hd" data-hd="genres"></div>`,
    };
    $("#homeBody").innerHTML = `<div class="nfchips"><button data-home-all="tv">Shows</button><button data-home-all="movie">Movies</button><button data-goto="browse">Categories</button></div>` +

/* The big banner at the top of Home: swipe through a few trending titles that aren't on the server yet (or something new in the
   library when there's nothing), the one showing plays its trailer by itself, Request (or Play) and More info. */
async function fillFeatured(heroes, list) {
  const el = $("#bb");
  if (!el) return;
  let items = heroes;
  if (!items.length) {
    const pool = list.filter(m => m.backdrop && m.status === "available").slice(0, 12);
    if (!pool.length) return el.remove();
    items = [pool[Math.floor(Math.random() * pool.length)]];
  }
  const ref = x => x.type === "tv" && !x.id ? {type: "tvtmdb", id: x.tmdb} : {type: x.type, id: x.id};
  const slide = (x, i, clone = false) => {
    const it = ref(x), have = x.status === "available", lab = ["pending", "processing"].includes(x.status) && statusLabel(x);
    return `<div class="bb${clone ? " clone" : ""}" data-i="${i}"${clone ? ' aria-hidden="true"' : ""}><div class="bb-media" style="background-image:url('${bg(x.backdrop)}')"></div><div class="bb-tr"></div>
      <button class="vmute" hidden aria-label="Sound on">${SPEAKER(false)}</button>
      <div class="bb-body"><p class="bb-kick">${heroes.length ? `Trending this week${x.type === "tv" ? " · Series" : ""}` : `New on ${esc(APP())}`}</p>
        <div class="bb-title">${esc(x.title)}</div>
        ${x.genres?.length ? `<div class="bb-genres">${x.genres.map(esc).join(" · ")}</div>` : ""}
        ${x.requested_by ? `<div class="bb-who">${WHO}Requested by ${esc(x.requested_by)}</div>` : ""}
        <div class="bb-acts">${have ? `<a class="btn bb-play" hidden target="_blank" rel="noopener">▶ Play</a>`
          : `<button class="btn bb-play bb-req">${lab ? esc(lab[0]) : "＋ " + esc(W("request"))}</button>`}
          <button class="btn gray bb-info" data-type="${it.type}" data-id="${it.id}">ⓘ More info</button></div></div></div>`;

}

function ofTap(e) {

  const x = (e.clientX - r.left) / s, y = (e.clientY - r.top) / s;
  const hit = W.hits.filter(h => x >= h.x0 && x <= h.x1 && y >= h.y0 && y <= h.y1)
    .sort((a, b) => (a.what.agent ? 0 : 1) - (b.what.agent ? 0 : 1) || (a.x1 - a.x0) * (a.y1 - a.y0) - (b.x1 - b.x0) * (b.y1 - b.y0))[0];

// ---- the made-up busy afternoon keeps changing, so the demo shows people moving around
function ofDemoStep(d) {
  const now = Date.now() / 1000, n = OF.demoN++, ev = e => d.events.unshift({at: now, ...e});
  d.now = now;
  d.downloads.forEach(x => { if (x.state === "downloading") { x.pct = Math.min(100, x.pct + 8 + Math.random() * 12); x.left = Math.max(30, (x.left || 900) - 150); } });
  d.downloads.filter(x => x.state === "importing").forEach(x => { x.pct = 100; x.state = "downloading"; });
  const done = d.downloads.find(x => x.pct >= 100);
  if (done) { d.downloads = d.downloads.filter(x => x !== done); d.delivered.unshift({title: done.title, poster: done.poster, at: now, who: "You", me: true, hue: 20}); ev({kind: "dl_done", title: done.title}); }
  switch (n % 5) {
    case 0: { const s = d.streams.shift(); if (s) { OF.demoBench = s; ev({kind: "stop", who: s.who, hue: s.hue, title: s.title}); } break; }
    case 1: { const x = d.searching.shift(); if (x) { d.downloads.push({key: "dx" + n, title: x.title, poster: x.poster, kind: x.kind, state: "downloading", pct: 3, left: 1500, sub: ""}); ev({kind: "dl", title: x.title}); } break; }
    case 2: { const s = OF.demoBench; if (s) { OF.demoBench = null; d.streams.push({...s, key: "d" + n, state: "playing"}); ev({kind: "watch", who: s.who, hue: s.hue, title: s.title}); } break; }
    case 3: { const p = d.pending.shift(); if (p) d.searching.push({key: "sx" + n, title: p.title, poster: p.poster, now: true, why: "Searching right now", asleep: false, who: p.who, hue: p.hue, me: p.me}); break; }
    case 4: {
      const pool = d.delivered.slice(2);
      const x = pool[n % Math.max(1, pool.length)];
      if (x) { d.pending.push({title: x.title, poster: x.poster, created: now, who: "Lena", hue: 290}); ev({kind: "req", who: "Lena", hue: 290, title: x.title}); }
      const s = d.streams[0]; if (s) s.state = s.state === "paused" ? "playing" : "paused";
      break;
    }
  }
  d.delivered = d.delivered.slice(0, 6);
  return d;
}

/* Swipe a sheet down to close it, like an iPhone sheet (only from the top of its content, and only a mostly
   vertical drag, so sideways rows like the cast still scroll). */
(() => {
  const sh = $("#sheet"), scrim = $("#scrim");
  let x0 = null, y0 = null, dy = 0, t0 = 0, dragging = false;
  sh.addEventListener("touchstart", e => {
    if (e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dy = 0; t0 = Date.now(); dragging = false;
  }, {passive: true});
  sh.addEventListener("touchmove", e => {
    if (y0 == null) return;
    const d = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
    if (!dragging) {
      if (sh.scrollTop > 0 || d < 0 || Math.abs(dx) > Math.abs(d)) { if (Math.abs(d) > 6 || Math.abs(dx) > 6) y0 = null; return; }
      if (d < 8) return;
      dragging = true; sh.style.transition = "none"; scrim.style.transition = "none";
    }
    dy = Math.max(0, d);
    sh.style.transform = `translateY(${dy}px)`;
    scrim.style.opacity = String(Math.max(0, 1 - dy / 600));
    e.preventDefault();
  }, {passive: false});
  const end = () => {
    if (!dragging) { y0 = null; return; }
    const fast = dy / Math.max(1, Date.now() - t0) > 0.5;
    sh.style.transition = ""; scrim.style.transition = ""; scrim.style.opacity = "";
    if (dy > 110 || (fast && dy > 30)) {
      sh.style.transform = "translateY(100%)";
      setTimeout(() => { closeSheet(); sh.style.transform = ""; }, 260);
    } else sh.style.transform = "";
    y0 = null; dragging = false; dy = 0;
  };
  sh.addEventListener("touchend", end);
  sh.addEventListener("touchcancel", end);
})();

/* ---------- Play here: the person's own Plex/Jellyfin, streamed through NuniFlix (server: player.py) ----------
   Safari and the iPhone/iPad play the stream themselves; other browsers use hls.js (web/vendor, loaded on first use)
   and get a version every browser can play (H.264 + stereo AAC). Progress goes back every 10 s so Plex/Jellyfin keep
   the resume point; "stopped" when the player closes. */
const PL = {native: !!document.createElement("video").canPlayType("application/vnd.apple.mpegurl")};
const plClock = s => { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
const plCanResume = e => e.resume > 60 && (!e.duration || e.resume < e.duration * .93);

async function playHere(it) {
  let o;
  try { o = await api(`/play/${it.type}/${it.id}`); } catch (e) { toast(e.message); return; }
  plOpen(it.title);
  PL.title = it;

}

function plEpisodes(eps) {
  const next = eps.find(plCanResume) || eps.find(e => !e.watched) || eps[0];
  const row = e => `<button class="li pl-ep${e.watched ? " seen" : ""}" data-id="${esc(e.id)}"><span class="pl-mark">${e.watched ? "✓" : plCanResume(e) ? "◐" : ""}</span>
    <div class="body"><div class="t">${esc(e.title || "Episode " + (e.episode ?? ""))}</div>
    <div class="s">${[e.season != null && `S${e.season} · E${e.episode}`, e.duration && Math.round(e.duration / 60) + "m", plCanResume(e) && Math.round((e.duration - e.resume) / 60) + "m left"].filter(Boolean).join(" · ")}</div></div></button>`;
  const seasons = [...new Set(eps.map(e => e.season ?? 0))].sort((a, b) => a - b);
  plBody().innerHTML = `<div class="pl-list">${next ? `<h2>Next up</h2><div class="list">${row(next)}</div>` : ""}
    ${seasons.map(n => `<h2>${n ? "Season " + n : "Specials"}</h2><div class="list">${eps.filter(e => (e.season ?? 0) === n).map(row).join("")}</div>`).join("")}</div>`;
  plBody().querySelectorAll(".pl-ep").forEach(b => b.onclick = () => {
    const i = eps.findIndex(e => e.id === b.dataset.id);

  });
}

function plAsk(e, upNext) {
  if (!plCanResume(e)) return plStart(e, 0, upNext);
  plBody().innerHTML = `<div class="pl-ask"><h2>${esc(e.title)}</h2>
    <button class="btn" id="plResume">Resume from ${plClock(e.resume)}</button><button class="btn gray" id="plFresh">Start from the beginning</button></div>`;
  $("#plResume").onclick = () => plStart(e, e.resume, upNext);
  $("#plFresh").onclick = () => plStart(e, 0, upNext);
}

let plHls = null;
function loadHls() {
  if (window.Hls) return Promise.resolve();
  return new Promise((ok, bad) => { const sc = document.createElement("script"); sc.src = "/vendor/hls.min.js"; sc.onload = ok; sc.onerror = bad; document.head.appendChild(sc); });
}

async function plStart(e, at, upNext, subtitle) {
  await plStopStream();
  PL.ep = e; PL.upNext = upNext; PL.sub = subtitle ?? null;
  if (subtitle != null || PL.vttFor !== e.id) PL.vtt = null;  // a burned-in track replaces drawn subtitles; a new episode drops them
  $("#player .pl-panel")?.setAttribute("hidden", "");
  plBody().innerHTML = `<div class="pl-stage"><video controls autoplay playsinline></video><p class="pl-msg">Starting…</p></div>`;
  const v = plBody().querySelector("video"), msg = plBody().querySelector(".pl-msg");
  const fail = text => { if (msg) { msg.textContent = text; msg.hidden = false; } };
  let st;
  try { st = await api("/play/start", {body: {id: e.id, offset: 0, platform: PL.native ? "ios" : "web", ...(subtitle != null ? {subtitle} : {})}}); }
  catch (err) { return fail(err.message); }
  if (!$("#player")) { api("/play/progress", {body: {session: st.session, position: 0, state: "stopped"}}).catch(() => {}); return; }
  PL.cur = {session: st.session, video: v, last: 0};
  $("#player .pl-cc").hidden = false;
  if (PL.vtt) plAddVtt(PL.vtt);
  v.addEventListener("loadedmetadata", () => { if (at > 0) v.currentTime = at; msg.hidden = true; }, {once: true});
  v.addEventListener("playing", () => { msg.hidden = true; });
  v.addEventListener("ended", async () => {
    await plStopStream();
    if (upNext.length) plStart(upNext[0], 0, upNext.slice(1)); else plClose();
  });
  v.addEventListener("error", () => fail("The video wouldn't play here. Try Play in Plex or Play in Jellyfin."));
  v.addEventListener("timeupdate", () => { if (Date.now() - PL.cur?.last > 10000) plReport("auto"); });
  v.addEventListener("pause", () => plReport("paused"));
  if (PL.native) { v.src = st.url; return; }
  try { await loadHls(); } catch { return fail("Couldn't load the player. Check your connection and try again."); }
  if (!window.Hls?.isSupported()) return fail("This browser can't play it. Try Play in Plex or Play in Jellyfin.");
  plHls = new Hls({startPosition: at > 0 ? at : -1});
  plHls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) fail("The video stopped: " + (d.details || "playback error") + ". Try again, or use Play in Plex."); });
  plHls.loadSource(st.url);
  plHls.attachMedia(v);
}

/* Subtitles (server: subtitles.py). Tracks on the title are burned in by Plex/Jellyfin (the stream restarts where you
   were); OpenSubtitles files (when that's the source in Settings) are added to the video as a subtitle track. */
async function plSubs() {
  const panel = $("#player .pl-panel"), e = PL.ep;
  if (!panel || !e) return;
  if (!panel.hidden) { panel.hidden = true; return; }
  panel.hidden = false;
  panel.innerHTML = `<p class="pl-note">Loading subtitles…</p>`;
  let t;
  try { t = await api(`/subs/${encodeURIComponent(e.id)}`); } catch (err) { panel.innerHTML = `<p class="pl-note">${esc(err.message)}</p>`; return; }
  const on = id => PL.sub === id && !PL.vtt ? " on" : "";
  panel.innerHTML = `<h3>Subtitles</h3>
    <button class="pl-opt${PL.sub == null && !PL.vtt || PL.sub === 0 ? " on" : ""}" data-t="0">Off</button>
    ${t.tracks.map(x => `<button class="pl-opt${on(x.id)}" data-t="${x.id}">${esc(x.title)}</button>`).join("")}
    ${PL.vtt ? `<button class="pl-opt on" disabled>From OpenSubtitles</button>` : ""}
    <button class="pl-opt find" id="plFind">Find subtitles…</button>`;
  panel.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    const id = Number(b.dataset.t), v = PL.cur?.video;
    if (id === 0 && PL.vtt) { PL.vtt = null; v?.querySelectorAll("track").forEach(x => x.remove()); panel.hidden = true; if (!PL.sub) return; }
    plStart(e, v?.currentTime || 0, PL.upNext, id);

}

async function plFind(e) {

function plAddVtt(url) {
  const v = PL.cur?.video;
  if (!v) return;
  v.querySelectorAll("track").forEach(x => x.remove());
  const t = document.createElement("track");
  Object.assign(t, {kind: "subtitles", label: "Subtitles", srclang: PL.title?.lang || "en", src: url, default: true});
  v.appendChild(t);
  t.track.mode = "showing";
  t.addEventListener("load", () => { t.track.mode = "showing"; });
}

function plReport(state) {

  c.last = Date.now();
  const v = c.video;
  api("/play/progress", {body: {session: c.session, position: v.currentTime || 0, duration: isFinite(v.duration) ? v.duration : null,
                                state: state === "auto" ? (v.paused ? "paused" : "playing") : state}}).catch(() => {});
}

async function plStopStream(beacon) {
  const c = PL.cur;
  if (!c) return;
  PL.cur = null;
  if (plHls) { plHls.destroy(); plHls = null; }
  const body = {session: c.session, position: c.video.currentTime || 0, duration: isFinite(c.video.duration) ? c.video.duration : null, state: "stopped"};
  c.video.pause(); c.video.removeAttribute("src"); c.video.load();
  if (beacon) return fetch("/api/play/progress", {method: "POST", keepalive: true, credentials: "same-origin",
                                                 headers: {"X-NF": "1", "Content-Type": "application/json"}, body: JSON.stringify(body)}).catch(() => {});
  await api("/play/progress", {body}).catch(() => {});
}

function plClose() {

function epNote(e) {
  if (e.status === "available") return "Available";
  if (e.status === "pending") return "Waiting";
  if (e.status === "processing") return "On its way";
  if (!e.air_date) return "TBA";
  const d = new Date(e.air_date + "T12:00"), same = d.getFullYear() === new Date().getFullYear();
  const txt = d.toLocaleDateString(undefined, {month: "short", day: "numeric", ...(same ? {} : {year: "numeric"})});
  return e.aired ? txt : "Airs " + txt;
}

/* Repertory and Premiere give each title its own color: the strongest one in its poster (black when the poster has none). */
const INK_THEMES = ["repertory", "premiere"];
const INKS = new Map();
function posterHue(url) {
  if (!INKS.has(url)) INKS.set(url, new Promise(done => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onerror = () => done(null);
    img.onload = () => {
      try {
        const c = document.createElement("canvas"), x = c.getContext("2d", {willReadFrequently: true});
        c.width = 24; c.height = 36; x.drawImage(img, 0, 0, 24, 36);
        const d = x.getImageData(0, 0, 24, 36).data, bins = Array.from({length: 24}, () => [0, 0]);
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, ch = mx - mn;
          const s = ch ? ch / (1 - Math.abs(2 * l - 1)) : 0;
          if (s < .35 || l < .15 || l > .85) continue;
          const h = (mx === r ? ((g - b) / ch + 6) % 6 : mx === g ? (b - r) / ch + 2 : (r - g) / ch + 4) * 60;
          const w = s * (1 - Math.abs(l - .5) * 1.6), bin = bins[Math.floor(h / 15) % 24];
          bin[0] += w; bin[1] += h * w;
        }
        const best = bins.reduce((a, b) => b[0] > a[0] ? b : a);
        done(best[0] > 2 ? Math.round(best[1] / best[0]) : "mono");
      } catch { done(null); }
    };
    // a tiny copy at its own address: the full-size poster may already be cached without permission to read its pixels
    img.src = /\/(w\d+|original)\//.test(url) ? url.replace(/\/(w\d+|original)\//, "/w92/") : url + (url.includes("?") ? "&" : "?") + "ink";
  }));
  return INKS.get(url);
}
function paintInk(sh, url) {
  delete sh.dataset.ink; sh.style.removeProperty("--ink-h"); sh.dataset.inkFor = url || "";
  if (!INK_THEMES.includes(theme()) || !url) return;
  posterHue(url).then(h => {
    if (h == null || sh.dataset.inkFor !== url) return;
    if (h !== "mono") sh.style.setProperty("--ink-h", h);
    sh.dataset.ink = h === "mono" ? "mono" : "hue";
  });
}

function renderItem(it) {
  const sh = $("#sheet"), isTV = it.type === "tv";
  const meta = [it.year, isTV ? (it.network || "TV") : null, it.runtime ? `${it.runtime} min` : null,
    it.certification, it.rating ? `★ ${(+it.rating).toFixed(1)}` : null].filter(Boolean).map(esc).join(" · ");
  const lab = statusLabel(it);
  const pending = (it.requests || []).filter(r => r.status === "pending");
  const open = (it.requests || []).find(r => ["pending", "approved"].includes(r.status));

  // TV: every season stands on its own. Locked = already in the library, or waiting for approval.
  const pendHD = pending.filter(r => !r.is4k);  // a 4K request doesn't lock the regular seasons
  const pendAll = pendHD.find(r => !r.seasons), pendSet = new Set(pendHD.filter(r => !r.episodes).flatMap(r => r.seasons || []));
  const seasons = (isTV ? it.seasons || [] : []).map(s => {
    const full = !!s.episodes && s.have >= s.episodes, waiting = !full && (!!pendAll || pendSet.has(s.n));
    const note = full ? "Available" : waiting ? "Waiting for approval"
      : s.monitored ? (s.have ? `${s.have} of ${s.episodes} · on its way` : "Requested · searching")
      : s.have ? `${s.have} of ${s.episodes} episodes` : s.episodes ? `${s.episodes} episodes` : it.status === "none" ? "" : "Not aired yet";
    return {...s, full, waiting, locked: full || waiting, note};
  });
  const pickable = seasons.filter(s => !s.locked);
  const brandNew = isTV && it.status === "none" && !pending.length;  // nothing of it here yet: picking every season = the whole show

  let action;
  if (it.status === "available" && !isTV) action = `<button class="btn wide gray" disabled>${W("inLibrary")}</button>`;
  else if (!isTV && it.status === "pending") action = `<button class="btn wide gray" disabled>Requested${open?.requested_by.name ? " by " + esc(open.requested_by.name) : ""} · waiting for approval</button>`;
  else if (!isTV && it.status === "processing") action = `<button class="btn wide gray" disabled>${it.progress != null ? `Downloading · ${it.progress}%` : "Requested · on its way"}</button>`;
  else if (isTV && !pickable.length) action = `<button class="btn wide gray" disabled>${seasons.every(s => s.full) ? "✓ Every season is in your library" : "Everything is requested"}</button>`;
  else action = `<button class="btn wide" id="reqBtn">${W("request")}</button>`;
  if (ME.admin && pending.length) action += `<div style="height:8px"></div><button class="btn wide green" data-approve="${pending[0].id}">Approve ${esc(pending[0].requested_by.name)}'s request</button>`;
  // 4K copy (own server, own status)
  if (ME.has4k?.[it.type] && ME.perms?.request_4k) {
    const p4 = (it.requests || []).find(r => r.is4k && r.status === "pending");
    action += `<div style="height:8px"></div>` + (!isTV && it.status4k === "available" ? `<button class="btn wide gray" disabled>✓ In your library in 4K</button>`
      : !isTV && it.status4k === "processing" ? `<button class="btn wide gray" disabled>4K copy on its way</button>`
      : !isTV && p4 ? `<button class="btn wide gray" disabled>4K requested · waiting for approval</button>`
      : `<button class="btn wide gray" id="req4k">${W("request")} in 4K</button>` + (isTV ? `<p class="quota">Nothing picked = the whole show in 4K</p>` : ""));
  }
  const q = ME.quota?.[it.type];
  if (ME.admin) action += `<details class="adm" id="adv"><summary>Quality &amp; folder for this request</summary><div class="form" id="advForm"><div class="spin" style="margin:12px auto"></div></div></details>`;
  const canReport = ["available", "partial"].includes(it.status);
  const here = x => ["available", "partial"].includes(x), canPull = ME.admin && (here(it.status) || here(it.status4k));

  const seasonsHTML = seasons.length ? `<h2 style="font-size:19px">Seasons ${pickable.length > 1 ? `<small><button id="pickAll">Select all</button></small>` : ""}</h2>
    <div class="seasons" id="seasons">${seasons.map(s => `<div class="sgroup"><div class="srow">
      <button class="season ${s.locked ? "locked" : ""}" data-n="${s.n}">
      <span class="check"></span><span class="name">Season ${s.n}</span><span class="muted" style="font-size:14px">${s.note}</span></button>
      <button class="epbtn" data-eps="${s.n}" aria-label="Episodes of season ${s.n}">Episodes</button></div><div class="eps" hidden></div></div>`).join("")}</div>
    ${pickable.length ? `<p class="foot" style="padding:0">Only want a few? Tap <b>Episodes</b> on a season.</p>` : ""}` : "";

  const streaming = it.streaming?.length ? `<div class="streaming">Streaming on ${it.streaming.map(p =>
    `<button data-prov="${p.id}" data-name="${esc(p.name)}" title="${esc(p.name)}">${p.logo ? `<img src="${esc(p.logo)}" alt="${esc(p.name)}">` : esc(p.name)}</button>`).join("")}</div>` : "";

  sh.innerHTML = `<button class="close" aria-label="Close">✕</button>
    <div class="hero" style="background-image:url('${bg(it.backdrop || it.poster || "")}')"></div>
    <div class="detail">
      <div class="head"><div class="poster">${it.poster ? `<img src="${esc(it.poster)}" alt="">` : ""}</div>
        <div><h3>${esc(it.title)}</h3><div class="meta">${meta}</div>
          ${it.genres?.length ? `<div class="meta">${it.genres.map(esc).join(", ")}</div>` : ""}
          ${lab ? `<span class="tag ${({available: "green", partial: "green", processing: "blue", pending: "orange"})[lab[1]]}">${it.status === "partial" ? "Partly available" : lab[0]}</span>` : ""}</div></div>
      ${it.overview ? `<p class="overview">${esc(it.overview)}</p>` : `<div style="height:14px"></div>`}
      <div id="trailerSlot"></div>
      ${streaming}
      <div class="watch" id="watchSlot"></div>
      ${action}
      ${seasonsHTML}
      ${canReport ? `<button class="btn wide gray" id="reportBtn" style="margin-top:14px">Report a problem</button>
        ${it.issues ? `<p class="quota">${it.issues} open problem report${it.issues === 1 ? "" : "s"}</p>` : ""}<div id="reportBox"></div>` : ""}
      ${canPull ? `<button class="btn wide gray" id="pullBtn" style="margin-top:10px">Mark unavailable</button><div id="pullBox"></div>` : ""}
      <div id="extras"></div>
    </div>`;
  sh.querySelector(".close").onclick = closeSheet;
  paintInk(sh, it.poster);

  const rb = $("#reqBtn");
  const seasonBtns = () => $$(".season[data-n]:not(.locked)", sh);
  const chosen = () => seasonBtns().filter(b => b.classList.contains("on")).map(b => +b.dataset.n);
  const chosenEps = () => $$(".ep.on", sh).map(b => [+b.closest(".sgroup").querySelector("[data-n]").dataset.n, +b.dataset.e]);
  const sync = () => {
    if (!rb || !isTV) return;
    const eps = chosenEps();
    if (eps.length) {
      rb.disabled = false;
      rb.textContent = `${W("request")} ${eps.length === 1 ? `S${eps[0][0]} · E${eps[0][1]}` : `${eps.length} episodes of Season ${eps[0][0]}`}`;
      const pa = $("#pickAll"); if (pa) pa.textContent = "Select all";
      return;
    }
    const n = chosen().length;
    rb.disabled = !n;
    rb.textContent = !n ? "Pick the seasons you want" : n === pickable.length && brandNew ? `${W("request")} the whole show`
      : `${W("request")} ${n === 1 ? "Season " + chosen()[0] : n + " seasons"}`;
    const pa = $("#pickAll"); if (pa) pa.textContent = n === pickable.length ? "Clear" : "Select all";
  };
  const clearEps = () => $$(".ep.on", sh).forEach(x => x.classList.remove("on"));
  seasonBtns().forEach(b => b.onclick = () => { b.classList.toggle("on"); clearEps(); sync(); });
  const pa = $("#pickAll");
  if (pa) pa.onclick = () => { const all = chosen().length !== pickable.length; seasonBtns().forEach(b => b.classList.toggle("on", all)); clearEps(); sync(); };
  // episodes: open a season to pick single episodes (one season at a time)
  $$(".epbtn", sh).forEach(b => b.onclick = async () => {
    const box = b.closest(".sgroup").querySelector(".eps"), n = +b.dataset.eps;
    box.hidden = !box.hidden; b.classList.toggle("open", !box.hidden);
    if (box.hidden || box.dataset.loaded) return;
    box.innerHTML = `<div class="spin" style="margin:14px auto"></div>`;
    try {
      const d = await api(`/item/tv/${it.id}/season/${n}`);
      box.dataset.loaded = "1";
      box.innerHTML = d.episodes.map(e => `<button class="season ep ${e.status !== "none" ? "locked" : ""}" data-e="${e.n}">
        <span class="check"></span><span class="name">${e.n}. ${esc(e.title || "Episode " + e.n)}</span><span class="muted" style="font-size:13px">${epNote(e)}</span></button>`).join("")
        || `<p class="empty" style="padding:12px">No episodes listed yet.</p>`;
      $$(".ep:not(.locked)", box).forEach(x => x.onclick = () => {
        $$(".ep.on", sh).forEach(o => { if (o.closest(".eps") !== box) o.classList.remove("on"); });
        seasonBtns().forEach(sb => sb.classList.remove("on"));
        x.classList.toggle("on"); sync();
      });
    } catch (err) { box.innerHTML = `<p class="empty" style="padding:12px">${esc(err.message)}</p>`; }
  });
  sync();

  const doRequest = async (btn, is4k) => {
    const on = chosen(), eps = isTV ? chosenEps() : [];
    // the whole show for something brand new (so future seasons are followed too); otherwise exactly what was picked
    // 4K with nothing picked = the whole show in 4K (seasons already here in HD are locked above, but can still be wanted in 4K)
    const whole = !isTV || (brandNew && on.length === pickable.length) || (is4k && !on.length);
    const body = eps.length ? {type: it.type, id: it.id, seasons: [eps[0][0]], episodes: eps.map(e => e[1])}

    if (act === "resolve") { const t = prompt("Fixed! Add a note? (optional)"); if (t === null) return; req = api(`/issues/${iid}`, {body: {status: "resolved", ...(t ? {reply: t} : {})}}); }

/* Trailers that play by themselves: muted, looping, hidden until they really play (YouTube refuses some), paused whenever
   they're out of sight (another screen, a title page on top, scrolled away, app in the background). Tap the speaker for sound. */
const SPEAKER = on => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/>${on
  ? `<path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>` : `<path d="m22 9-6 6M16 9l6 6"/>`}</svg>`;
const autoplayOK = () => ME?.prefs?.autoplay !== false && !navigator.connection?.saveData && !matchMedia("(prefers-reduced-motion: reduce)").matches;
async function ytInto(host, url, still, muteBtn) {
  const key = url?.split("v=")[1];
  if (!key || !host || !autoplayOK()) return;
  try {
    const YT = await youtube();
    if (!host.isConnected || !still()) return;
    host.innerHTML = "<div></div>";
    let ours = false;
    const player = new YT.Player(host.firstChild, {videoId: key, host: "https://www.youtube-nocookie.com", width: "100%", height: "100%",
      playerVars: {autoplay: 1, mute: 1, controls: 0, playsinline: 1, loop: 1, playlist: key, modestbranding: 1, rel: 0, iv_load_policy: 3, disablekb: 1, cc_load_policy: 0, cc_lang_pref: "zxx"},
      events: {onReady: e => { e.target.mute(); try { e.target.unloadModule("captions"); } catch {} if (still()) e.target.playVideo(); },
               // shown a moment after it starts, once YouTube's own start-up overlay has gone
               onStateChange: e => { if (e.data === 1) { try { e.target.setOption("captions", "track", {}); e.target.unloadModule("captions"); e.target.unloadModule("cc"); } catch {} }
                 if (e.data === 1 && !host.classList.contains("on")) setTimeout(() => { host.classList.add("on"); if (muteBtn) muteBtn.hidden = false; }, 3000); },
               onError: () => { host.innerHTML = ""; host.classList.remove("on"); if (muteBtn) muteBtn.hidden = true; }}});
    if (muteBtn) muteBtn.onclick = e => {
      e.stopPropagation();
      const was = player.isMuted();
      if (was) player.unMute(); else player.mute();
      muteBtn.innerHTML = SPEAKER(was); muteBtn.setAttribute("aria-label", was ? "Mute" : "Sound on");
    };
    const t = setInterval(() => {
      if (!host.isConnected) { clearInterval(t); try { player.destroy(); } catch {} return; }
      const st = player.getPlayerState?.();
      if (!still()) { if (st === 1) { player.pauseVideo(); ours = true; } }
      else if (ours && st === 2) { player.playVideo(); ours = false; }
    }, 700);
  } catch {}
}
async function playTrailer(url, stillTop) {  // muted, looping trailer on the top card; stays hidden until it actually plays
  try {
    const key = url?.split("v=")[1];
    if (!key) return;
    const YT = await youtube(), top = $('.sw-card[data-i="0"]');
    if (!top || !stillTop()) return;
    const host = $(".sw-trailer", top);
    host.style.opacity = 0; host.style.transition = "opacity .5s";
    host.innerHTML = "<div></div>";
    new YT.Player(host.firstChild, {videoId: key, host: "https://www.youtube-nocookie.com", width: "100%", height: "100%",
      playerVars: {autoplay: 1, mute: 1, controls: 0, playsinline: 1, loop: 1, playlist: key, modestbranding: 1, rel: 0, iv_load_policy: 3},
      events: {onReady: e => { e.target.mute(); e.target.playVideo(); },
               onStateChange: e => { if (e.data === 1) host.style.opacity = 1; },
               onError: () => { host.innerHTML = ""; }}});
  } catch {}
}
function swDrag(card, onAct) {
  if (!card) return;
  let x0 = null, dx = 0;
  card.onpointerdown = e => { x0 = e.clientX; dx = 0; card.setPointerCapture(e.pointerId); card.style.transition = "none"; };
  card.onpointermove = e => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    $(".stamp.like", card).style.opacity = Math.max(0, dx / 110);
    $(".stamp.skip", card).style.opacity = Math.max(0, -dx / 110);
  };
  card.onpointerup = card.onpointercancel = () => {
    if (x0 === null) return;
    x0 = null; card.style.transition = "";
    if (Math.abs(dx) > 110) return onAct(dx > 0 ? "like" : "skip");
    if (Math.abs(dx) < 6) return onAct("info");  // a tap opens the details
    card.style.transform = ""; $$(".stamp", card).forEach(t => t.style.opacity = 0);
  };
}
function swAct(kind) {

async function shareWrapped(w) {  // a 1080×1920 story image in the current theme's colors
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();

  const g = c.getContext("2d");

  g.fillStyle = grd; g.fillRect(0, 0, 1080, 1920);
  g.fillStyle = "rgba(0,0,0,.3)"; g.fillRect(0, 0, 1080, 1920);
  const font = (wt, px) => g.font = `${wt} ${px}px -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif`;
  const fit = (t, max) => { while (g.measureText(t).width > max && t.length > 4) t = t.slice(0, -2).trimEnd() + "…"; return t; };
  g.fillStyle = "#fff";
  font(700, 42); g.globalAlpha = .85; g.fillText(`${APP().toUpperCase()} WRAPPED ${w.year}`, 90, 190); g.globalAlpha = 1;
  font(800, 92); g.fillText(fit(`${ME.name}'s year`, 900), 90, 320);
  const stat = (val, label, y) => { font(800, 160); g.fillText(val, 90, y); font(600, 46); g.globalAlpha = .85; g.fillText(label, 94, y + 66); g.globalAlpha = 1; };
  stat(w.hours.toLocaleString(), "hours watched", 620);
  stat(String(w.movies), w.movies === 1 ? "movie" : "movies", 900);
  stat(w.episodes.toLocaleString(), "episodes", 1180);
  if (w.top_shows.length) {
    font(700, 42); g.globalAlpha = .85; g.fillText("TOP SHOWS", 90, 1390); g.globalAlpha = 1;
    font(700, 56); w.top_shows.slice(0, 3).forEach((t, n) => g.fillText(fit(`${n + 1}. ${t.title}`, 900), 90, 1480 + n * 84));
  }
  if (w.genres.length) { font(600, 46); g.fillText(fit(`Mostly ${w.genres.slice(0, 2).map(x => x.name).join(" & ")}`, 900), 90, 1800); }
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  const file = new File([blob], `nuniflix-wrapped-${w.year}.png`, {type: "image/png"});
  if (navigator.canShare?.({files: [file]})) {
    try { await navigator.share({files: [file], title: `My ${APP()} Wrapped`}); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ---------- phone notifications ---------- */
const b64u = s => Uint8Array.from(atob((s + "===".slice((s.length + 3) % 4)).replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone;
async function pushSub() {
  const reg = await navigator.serviceWorker.getRegistration("/");
  return reg ? reg.pushManager.getSubscription() : null;
}
async function setupPushSwitch() {
  const sw = $("#fNotif [name=push]"), note = $("#pushNote");
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !isSecureContext) {
    sw.disabled = true;
    note.textContent = !isSecureContext ? `Phone notifications need ${APP()} on a secure (https) address.`
      : /iPhone|iPad/.test(navigator.userAgent) && !standalone() ? `On iPhone: tap Share → Add to Home Screen, open ${APP()} from there, then turn this on.`
      : "This browser can't do notifications.";
    return;
  }
  sw.checked = !!(await pushSub().catch(() => null));
  sw.onchange = async () => {
    sw.disabled = true;
    try {
      if (sw.checked) {
        const reg = await navigator.serviceWorker.register("/sw.js");
        if (await Notification.requestPermission() !== "granted") throw new Error(`Notifications are turned off for ${APP()} in your settings.`);
        const {key} = await api("/push/key");
        const sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64u(key)});
        await api("/push/subscribe", {body: sub.toJSON()});
        await api("/me/prefs", {body: {push: true}});
        await api("/push/test", {method: "POST"});
        toast("Turned on. A test notification is on its way.");
      } else {
        const sub = await pushSub();
        if (sub) { await api("/push/unsubscribe", {body: {endpoint: sub.endpoint}}); await sub.unsubscribe(); }
      }
    } catch (e) { toast(e.message); sw.checked = !sw.checked; }
    sw.disabled = false;
  };
}

/* Plex, Discord and Fluxer all sign in in a separate window while we poll with a secret state. */
async function popupSignIn(prefix) {
  const win = window.open("", "nfauth", "width=600,height=760");  // open now so popup blockers allow it
  try {
    const {state, url} = await api(prefix + "/start", {body: {}, quiet: true});
    if (win) win.location = url; else location.href = url;
    const check = () => api(prefix + "/check", {body: {state, device: device()}, quiet: true});
    const t0 = Date.now();
    while (Date.now() - t0 < 300000) {
      await new Promise(r => setTimeout(r, 1500));
      const r = await check();
      if (r._status === 200) { win?.close(); return r; }
      if (win && win.closed && Date.now() - t0 > 4000) {
        await new Promise(r => setTimeout(r, 1500));
        const last = await check();
        if (last._status === 200) return last;
        throw new Error("The sign-in window closed before finishing.");
      }
    }
    throw new Error("Sign-in timed out.");
  } catch (e) { win?.close(); throw e; }
}
const device = () => /iPhone|iPad/.test(navigator.userAgent) ? "iPhone (web)" : /Android/.test(navigator.userAgent) ? "Android (web)" : "Browser";

async function stest(kind, root) {
  const form = $(`form[data-kind=${kind}]`, root), out = $(`[data-out=${kind}]`, root);
  out.className = "foot"; out.textContent = "Checking…";
  try {
    const r = await api("/setup/test", {body: {kind, ...formObj(form)}, quiet: true});
    out.textContent = (r.ok ? "✓ " : "✕ ") + r.message; out.classList.add(r.ok ? "ok" : "bad");
    SETUP.ok[kind] = r.ok;
    if (r.ok && r.options) {  // Radarr/Sonarr: show quality + folder pickers
      const c = SETUP.cfg[kind];
      $$(".opt", form).forEach(l => l.remove());
      form.insertAdjacentHTML("beforeend", `
        <label class="opt"><span>Quality</span>${sel("profile", r.options.profiles.map(p => [p.id, p.name]), c.profile)}</label>
        <label class="opt"><span>Folder</span>${sel("root", r.options.roots.map(x => [x, x]), c.root)}</label>` + (kind === "radarr"
        ? `<label class="opt"><span>Grab when</span>${sel("availability", [["announced", "Announced"], ["inCinemas", "In cinemas"], ["released", "Released"]], c.availability)}</label>`
        : `<label class="opt"><span style="width:auto">Season folders</span>${swi("season_folders", c.season_folders)}</label>`));
    }
    if (kind === "fluxer" && r.servers?.length) {  // Fluxer: pick the server from the ones the bot is in
      const cur = $("[name=guild_id]", form).value;
      $("#fxGuildBox").innerHTML = sel("guild_id", [["", "Pick a server"], ...r.servers.map(x => [x.id, x.name])], cur);
      $("#fxGuildBox select").onchange = () => { $("#fxRoleBox").innerHTML = `<input name="role_id" value="" placeholder="Pick the server first">`; stest("fluxer", root); };
    }
    if ((kind === "discord" || kind === "fluxer") && r.ok && r.roles) {  // a bot token: pick the role from a list
      const cur = $("[name=role_id]", form).value;
      $(kind === "fluxer" ? "#fxRoleBox" : "#roleBox").innerHTML = sel("role_id", [["", "Anyone in the server"], ...r.roles.map(x => [x.id, x.name])], cur);
    }
    return r;
  } catch (e) { out.textContent = "✕ " + e.message; out.classList.add("bad"); SETUP.ok[kind] = false; }
}
